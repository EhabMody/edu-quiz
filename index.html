<style>
  :root {

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>
<div class="confetti-container" id="confettiContainer"></div>

<section id="authScreen" class="screen active">
  <div class="auth-wrapper">

      <form id="registerForm" style="display:none;" onsubmit="handleRegister(event)">

        </div>
        <div class="form-group"><label class="form-label">البريد الإلكتروني</label><input type="email" class="form-input" id="regEmail" required placeholder="you@example.com" dir="ltr" style="text-align:left;"></div>

        <div class="form-group">
          <label class="form-label">أنا...</label>

  if (!clean) return 'rtl';

}

/* ✅ دوال ضغط الصور قبل الرفع */
function compressImage(file, maxDimension = MAX_IMAGE_DIMENSION, quality = IMAGE_QUALITY) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) { resolve(file); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDimension || height > maxDimension) {
          if (width > height) { height = Math.round((height * maxDimension) / width); width = maxDimension; }
          else { width = Math.round((width * maxDimension) / height); height = maxDimension; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          if (!blob) { reject(new Error('فشل ضغط الصورة')); return; }
          const newFile = new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' });
          resolve(newFile);
        }, 'image/jpeg', quality);
      };
      img.onerror = () => reject(new Error('فشل قراءة الصورة'));
      img.src = ev.target.result;
    };
    reader.onerror = () => reject(new Error('فشل قراءة الملف'));
    reader.readAsDataURL(file);
  });
}

function validateFileSize(file, maxMB, label = 'الملف') {

    return { ok: false, msg: `${label} كبير جداً (${(file.size/1024/1024).toFixed(2)}MB). الحد: ${maxMB}MB` };
  }
  return { ok: true };
}

const DB = {
  _toArray(data) {
    if (!data) return [];
    if (Array.isArray(data)) return data.filter(x => x !== null && x !== undefined);
    if (typeof data === 'object') {
      return Object.keys(data).filter(k => data[k] !== null && data[k] !== undefined).map(k => {
        const item = data[k];
        if (item && typeof item === 'object' && !item.id) return { ...item, id: isNaN(k) ? k : item.id || k };
        return item;
      });
    }
    return [];
  },
  async get(key, defaultValue = []) {
    let localData = defaultValue;
    try { const d = localStorage.getItem('edu_' + key); if (d) localData = JSON.parse(d); } catch {}
    if (firebaseEnabled && fbDB) {
      try {
        const snapshot = await fbDB.get(fbDB.ref(fbDB.db, key));
        const remoteData = snapshot.val();
        if (remoteData) {
          const arr = this._toArray(remoteData);
          try { localStorage.setItem('edu_' + key, JSON.stringify(arr)); } catch {}
          return arr;
        }
      } catch (e) {}
    }
    return this._toArray(localData);
  },
  async set(key, value) {
    const arr = Array.isArray(value) ? value : this._toArray(value);
    try { localStorage.setItem('edu_' + key, JSON.stringify(arr)); } catch {}
    if (firebaseEnabled && fbDB) {
      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          const asObject = {};
          arr.forEach((item, idx) => {
            if (!item) return;
            const itemId = item.id || ('idx_' + idx + '_' + Date.now());
            asObject[itemId] = item;
          });
          await fbDB.set(fbDB.ref(fbDB.db, key), asObject);
          return true;
        } catch (e) { await new Promise(r => setTimeout(r, 500 * attempt)); }
      }
      return false;
    }
    return true;
  },
  subscribe(key, callback) {
    if (!firebaseEnabled || !fbDB) return () => {};
    try { return fbDB.onValue(fbDB.ref(fbDB.db, key), (snapshot) => { callback(DB._toArray(snapshot.val())); }); } catch (e) { return () => {}; }
  }
};
async function hashPassword(password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), { name: 'PBKDF2' }, false, ['deriveBits']);
  const db = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' }, km, 256);
  return `pbkdf2_sha256$100000$${safeBtoa(salt)}$${safeBtoa(new Uint8Array(db))}`;
}
async function verifyPassword(h, p) {
  try {
    const parts = h.split('$');
    if (parts.length !== 4) return false;
    const salt = safeAtob(parts[2]);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(p), { name: 'PBKDF2' }, false, ['deriveBits']);
    const db = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: parseInt(parts[1]), hash: 'SHA-256' }, km, 256);
    return safeBtoa(new Uint8Array(db)) === parts[3];
  } catch { return false; }
}
function safeBtoa(bytes) { let binary = ''; const arr = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes); for (let i = 0; i < arr.length; i++) binary += String.fromCharCode(arr[i]); return btoa(binary); }
function safeAtob(str) { const binary = atob(str); const bytes = new Uint8Array(binary.length); for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i); return bytes; }

let _cachedAnnouncements = [];
let _announcementListenerStarted = false;

async function loadActiveAnnouncement() {
  try {
    _cachedAnnouncements = await DB.get('announcements');
    renderAnnouncementEverywhere();
  } catch (e) {}
}

function getActiveAnnouncement() {
  const now = Date.now();
  const active = _cachedAnnouncements.find(a => a.enabled && (!a.startDate || a.startDate <= now) && (!a.endDate || a.endDate >= now));
  if (!active) return null;
  const dismissed = localStorage.getItem('edu_announcement_dismissed');
  if (dismissed === active.id) return null;
  return active;
}

function renderAnnouncementEverywhere() {
  const active = getActiveAnnouncement();
  const containers = [
    document.getElementById('announcementContainer'),
    document.getElementById('announcementContainerQuiz')
  ];
  containers.forEach(container => {
    if (!container) return;
    if (!active) { container.innerHTML = ''; return; }
    if (active.type === 'banner' || active.imageUrl) {
      const bg = active.imageUrl
        ? `background-image: url('${active.imageUrl}');`
        : `background: linear-gradient(135deg, ${active.bgColor || '#4f46e5'}, ${active.bgColorEnd || '#8b5cf6'});`;
      const textDir = detectDirection(active.text || '');
      const titleDir = detectDirection(active.title || '');
      container.innerHTML = `<div class="announcement-banner" style="${bg}">
        <button class="announcement-banner-close" onclick="dismissAnnouncement('${active.id}')" title="إغلاق">✕</button>
        <div class="announcement-banner-inner">
          ${active.emoji ? `<span class="announcement-banner-emoji">${active.emoji}</span>` : ''}
          ${active.title ? `<h2 class="announcement-banner-title" dir="${titleDir}" style="text-align:${titleDir === 'ltr' ? 'left' : 'right'};">${escapeHtml(active.title)}</h2>` : ''}
          ${active.text ? `<p class="announcement-banner-text" dir="${textDir}" style="text-align:${textDir === 'ltr' ? 'left' : 'right'};">${escapeHtml(active.text)}</p>` : ''}
          ${active.link ? `<a href="${escapeHtml(active.link)}" target="_blank" rel="noopener" class="announcement-banner-cta">${escapeHtml(active.linkText || 'اعرف أكثر')} ←</a>` : ''}
        </div>
      </div>`;
    } else {
      const textDir = detectDirection(active.text || '');
      container.innerHTML = `<div class="announcement-bar" style="background: linear-gradient(135deg, ${active.bgColor || 'var(--primary)'}, ${active.bgColorEnd || 'var(--purple)'});">
        <span class="announcement-bar-emoji">${active.emoji || '📢'}</span>
        <div class="announcement-bar-content" dir="${textDir}" style="text-align:${textDir === 'ltr' ? 'left' : 'right'};">

        <button class="announcement-bar-close" onclick="dismissAnnouncement('${active.id}')" title="إغلاق">✕</button>
      </div>`;
    }
  });

async function ensureUserProfile(fbUser, existingProfile) {
  if (existingProfile) return existingProfile;
  const fallback = {
    id: fbUser.uid, email: fbUser.email,
    name: fbUser.displayName || (fbUser.email || '').split('@')[0] || 'مستخدم',
    role: 'student', provider: 'email', photoURL: fbUser.photoURL || null,
    createdAt: Date.now(), needsProfileCompletion: true,
    xp: 0, badges: [], streak: 0, lastQuizDate: null
  };
  if (fbUser.email && fbUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
    fallback.role = 'admin'; fallback.approved = true; fallback.needsProfileCompletion = false;
  }
  try {
    const users = await DB.get('users');
    const exists = users.find(u => u.id === fbUser.uid || u.email === fbUser.email);
    if (exists) return exists;
    users.push(fallback);
    await DB.set('users', users);
  } catch (e) {}
  return fallback;
}

async function awardXP(studentId, amount, reason) {
  if (amount <= 0) return;
  try {
    const users = await DB.get('users');
    const idx = users.findIndex(u => u.id === studentId);
    if (idx < 0) return;
    users[idx].xp = (users[idx].xp || 0) + amount;
    users[idx].lastXpReason = reason;
    users[idx].lastXpAt = Date.now();
    await DB.set('users', users);
    const notifs = await DB.get('notifications');
    notifs.push({ id: uid(), userId: studentId, title: `+${amount} نقطة XP`, body: reason, createdAt: Date.now(), read: false });
    await DB.set('notifications', notifs);
  } catch (e) {}
}

async function checkAndAwardBadges(studentId) {
  try {
    const users = await DB.get('users');
    const idx = users.findIndex(u => u.id === studentId);
    if (idx < 0) return [];
    const user = users[idx];
    if (!user.badges) user.badges = [];
    const attempts = await DB.get('attempts');
    const myAttempts = attempts.filter(a => a.studentId === studentId);
    const avg = myAttempts.length ? calculateAvg(myAttempts) : 0;
    const perfect = myAttempts.some(a => a.score === a.total && a.total > 0);
    const toAward = [];
    if (myAttempts.length >= 1 && !user.badges.includes('first_quiz')) toAward.push('first_quiz');
    if (myAttempts.length >= 5 && !user.badges.includes('five_quizzes')) toAward.push('five_quizzes');
    if (myAttempts.length >= 10 && !user.badges.includes('ten_quizzes')) toAward.push('ten_quizzes');
    if (perfect && !user.badges.includes('perfect_score')) toAward.push('perfect_score');
    if (avg >= 90 && myAttempts.length >= 3 && !user.badges.includes('excellent_avg')) toAward.push('excellent_avg');
    if ((user.streak || 0) >= 3 && !user.badges.includes('streak_3')) toAward.push('streak_3');
    if ((user.streak || 0) >= 7 && !user.badges.includes('streak_7')) toAward.push('streak_7');
    if ((user.xp || 0) >= 800 && !user.badges.includes('high_scorer')) toAward.push('high_scorer');
    if (toAward.length > 0) {
      user.badges.push(...toAward);
      await DB.set('users', users);
      const notifs = await DB.get('notifications');
      toAward.forEach(b => {
        notifs.push({ id: uid(), userId: studentId, title: `🏆 شارة جديدة: ${BADGES[b].name}`, body: `${BADGES[b].emoji} ${BADGES[b].desc}`, createdAt: Date.now(), read: false });
      });
      await DB.set('notifications', notifs);
    }
    return toAward;
  } catch (e) { return []; }
}

async function updateStreak(studentId) {
  try {
    const users = await DB.get('users');
    const idx = users.findIndex(u => u.id === studentId);
    if (idx < 0) return;
    const user = users[idx];
    const today = new Date().toDateString();
    const lastDate = user.lastQuizDate ? new Date(user.lastQuizDate).toDateString() : null;
    if (lastDate === today) return;
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    if (lastDate === yesterday.toDateString()) user.streak = (user.streak || 0) + 1;
    else user.streak = 1;
    user.lastQuizDate = Date.now();
    await DB.set('users', users);
  } catch (e) {}
}

function calculateXPForAttempt(attempt) {
  const pct = attempt.total > 0 ? (attempt.score / attempt.total) * 100 : 0;
  let xp = Math.round(attempt.score * 10);
  if (pct >= 100) xp += 50;
  else if (pct >= 90) xp += 30;
  else if (pct >= 80) xp += 20;
  else if (pct >= 50) xp += 10;
  return xp;
}

async function handleRegister(e) {
  e.preventDefault();
  if (!platformSettings.registrationEnabled) { showAlert('التسجيل متوقف مؤقتاً', 'warning'); return; }
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim().toLowerCase();
  const password = document.getElementById('regPassword').value;
  if (!selectedRole) { showAlert('اختر دورك'); return; }
  const np = name.split(/\s+/).filter(p => p.length > 0);
  if (np.length < 3) { showAlert('يجب إدخال الاسم الثلاثي'); return; }
  const profile = { name, email, role: selectedRole, createdAt: Date.now(), provider: 'email', xp: 0, badges: [], streak: 0 };

  if (selectedRole === 'student') {
    const school = document.getElementById('regSchool').value.trim();
    const stage = document.getElementById('regStage').value;
    const grade = document.getElementById('regGrade').value;
    if (!school) { showAlert('أدخل اسم المدرسة'); return; }
    if (!stage || !grade) { showAlert('اختر المرحلة والسنة'); return; }
    profile.school = school; profile.stage = stage; profile.grade = grade;
    profile.parentName = document.getElementById('regParentName').value.trim();
    profile.parentPhone = document.getElementById('regParentPhone').value.trim();
  } else if (selectedRole === 'teacher') {
    const subject = document.getElementById('regSubject').value;
    if (!subject) { showAlert('اختر المادة'); return; }
    profile.subject = subject; profile.approved = false;
    profile.bio = ''; profile.videoLinks = []; profile.materialFiles = []; profile.ratings = [];
  } else if (selectedRole === 'parent') {
    profile.children = [];
  }
  if (email === ADMIN_EMAIL.toLowerCase()) { profile.role = 'admin'; profile.approved = true; }

  showLoading();
  try {
    if (firebaseAuthEnabled) {
      try {
        const cred = await fbAuth.createUserWithEmailAndPassword(fbAuth.auth, email, password);
        profile.id = cred.user.uid;
        const users = await DB.get('users');
        if (users.find(u => u.email === email || u.id === profile.id)) { showAlert('هذا البريد مسجل بالفعل'); return; }
        users.push(profile);
        await DB.set('users', users);
        currentUser = profile;
        saveSession(profile.id, true);
        showAlert('تم إنشاء الحساب!', 'success');
        launchConfetti(50);
        setTimeout(() => enterDashboard(), 500);
      } catch (err) {
        const msgs = { 'auth/email-already-in-use': 'البريد مسجل بالفعل', 'auth/weak-password': 'كلمة المرور ضعيفة', 'auth/invalid-email': 'البريد غير صالح' };
        showAlert(msgs[err.code] || err.message);
      }
      return;
    }
    const users = await DB.get('users');
    if (users.find(u => u.email === email)) { showAlert('هذا البريد مسجل'); return; }
    profile.id = uid();
    profile.passwordHash = await hashPassword(password);
    users.push(profile);
    await DB.set('users', users);
    currentUser = profile;
    saveSession(profile.id, true);
    showAlert('تم إنشاء الحساب!', 'success');
    launchConfetti(50);
    setTimeout(() => enterDashboard(), 500);
  } finally { hideLoading(); }
}

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value;
  const remember = document.getElementById('rememberMe').checked;
  showLoading();
  try {
    if (firebaseAuthEnabled) {
      try {
        if (fbAuth.setPersistence) { try { await fbAuth.setPersistence(fbAuth.auth, remember ? fbAuth.browserLocalPersistence : fbAuth.browserSessionPersistence); } catch (e) {} }
        const cred = await fbAuth.signInWithEmailAndPassword(fbAuth.auth, email, password);
        const users = await DB.get('users');
        let user = users.find(u => u.id === cred.user.uid) || users.find(u => u.email && cred.user.email && u.email.toLowerCase() === cred.user.email.toLowerCase());
        if (!user) user = await ensureUserProfile(cred.user, null);
        if (email === ADMIN_EMAIL.toLowerCase() && user.role !== 'admin') {
          user.role = 'admin'; user.approved = true;
          const idx = users.findIndex(u => u.id === user.id);
          if (idx >= 0) users[idx] = user; else users.push(user);
          await DB.set('users', users);
        }
        currentUser = user;
        saveSession(user.id, remember);
        enterDashboard();
      } catch (err) {
        const msgs = { 'auth/user-not-found': 'لا يوجد حساب', 'auth/wrong-password': 'كلمة المرور خاطئة', 'auth/invalid-credential': 'بيانات غير صحيحة' };
        showAlert(msgs[err.code] || 'البريد أو كلمة المرور خاطئة');
      }
      return;
    }
    const users = await DB.get('users');
    let user = users.find(u => u.email === email);
    if (!user) { showAlert('البريد أو كلمة المرور خاطئة'); return; }
    let valid = false;
    if (user.passwordHash) valid = await verifyPassword(user.passwordHash, password);
    else if (user.password) valid = (user.password === password);
    if (!valid) { showAlert('البريد أو كلمة المرور خاطئة'); return; }
    if (email === ADMIN_EMAIL.toLowerCase() && user.role !== 'admin') {
      user.role = 'admin'; user.approved = true;
      const idx = users.findIndex(u => u.id === user.id);
      if (idx >= 0) { users[idx] = user; await DB.set('users', users); }
    }
    currentUser = user;
    saveSession(user.id, remember);
    enterDashboard();
  } finally { hideLoading(); }
}

async function handleGoogleSignIn() {
  if (!firebaseAuthEnabled) { showAlert('غير متاح', 'warning'); return; }
  const btn = document.getElementById('googleBtn');
  const orig = btn.innerHTML;
  btn.disabled = true;
  try {
    const provider = new fbAuth.GoogleAuthProvider();
    provider.addScope('email'); provider.addScope('profile');
    if (isMobileDevice()) {
      sessionStorage.setItem('edu_google_redirect', '1');
      await fbAuth.signInWithRedirect(fbAuth.auth, provider);
      return;
    }
    const result = await fbAuth.signInWithPopup(fbAuth.auth, provider);
    await processGoogleUser(result.user);
  } catch (err) { showAlert('تعذر تسجيل الدخول: ' + (err.message || 'خطأ')); }
  finally { btn.disabled = false; btn.innerHTML = orig; }
}

async function processGoogleUser(g) {
  if (!g || !g.email) { showAlert('تعذر الحصول على البيانات'); return; }
  const users = await DB.get('users');
  let existing = users.find(u => u.id === g.uid || (u.email && g.email && u.email.toLowerCase() === g.email.toLowerCase()));
  if (!existing && !platformSettings.registrationEnabled) { showAlert('التسجيل متوقف مؤقتاً', 'warning'); return; }
  if (g.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() && existing) {
    existing.role = 'admin'; existing.approved = true;
    const idx = users.findIndex(u => u.id === existing.id);
    if (idx >= 0) { users[idx] = existing; await DB.set('users', users); }
  }
  if (existing) {
    const np = (existing.name || '').split(/\s+/).filter(p => p.length > 0);
    if (np.length < 3 && !isAdmin(existing)) {
      pendingGoogleUser = { id: existing.id, email: existing.email, name: existing.name, photoURL: existing.photoURL, isExisting: true };
      openProfileCompletionModal(true);
      return;
    }
    currentUser = existing;
    saveSession(existing.id, true);
    showAlert(`مرحباً ${existing.name}!`, 'success');
    setTimeout(() => enterDashboard(), 400);
  } else {
    pendingGoogleUser = { id: g.uid, email: g.email, name: g.displayName || '', photoURL: g.photoURL || null, isExisting: false };
    openProfileCompletionModal(false);
  }
}

async function handleGoogleRedirectResult() {
  if (!firebaseAuthEnabled || !fbAuth.getRedirectResult) return;
  if (sessionStorage.getItem('edu_google_redirect') !== '1') return;
  isProcessingRedirect = true;
  showLoading();
  try {
    const result = await fbAuth.getRedirectResult(fbAuth.auth);
    sessionStorage.removeItem('edu_google_redirect');
    if (result && result.user) await processGoogleUser(result.user);
  } catch (err) { sessionStorage.removeItem('edu_google_redirect'); }
  finally { hideLoading(); isProcessingRedirect = false; }
}

async function completeGoogleProfile() {
  if (!pendingGoogleUser) return;
  if (!googleSelectedRole) { alert('اختر دورك'); return; }
  const fullName = document.getElementById('gFullName').value.trim();
  const np = fullName.split(/\s+/).filter(p => p.length > 0);
  if (np.length < 3) { alert('يجب إدخال الاسم الثلاثي'); return; }
  const profile = { id: pendingGoogleUser.id, email: pendingGoogleUser.email, name: fullName, role: googleSelectedRole, provider: 'google', photoURL: pendingGoogleUser.photoURL, createdAt: Date.now(), xp: 0, badges: [], streak: 0 };
  if (pendingGoogleUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) { profile.role = 'admin'; profile.approved = true; }
  if (googleSelectedRole === 'student' && profile.role !== 'admin') {
    const school = document.getElementById('gSchool').value.trim();
    const stage = document.getElementById('gStage').value;
    const grade = document.getElementById('gGrade').value;
    if (!school || !stage || !grade) { alert('أكمل البيانات'); return; }
    profile.school = school; profile.stage = stage; profile.grade = grade;
    profile.parentName = document.getElementById('gParentName').value.trim();
    profile.parentPhone = document.getElementById('gParentPhone').value.trim();
  } else if (googleSelectedRole === 'teacher' && profile.role !== 'admin') {
    const subject = document.getElementById('gSubject').value;
    if (!subject) { alert('اختر المادة'); return; }
    profile.subject = subject; profile.approved = false;
    profile.bio = ''; profile.videoLinks = []; profile.materialFiles = []; profile.ratings = [];
  } else if (googleSelectedRole === 'parent') { profile.children = []; }
  showLoading();
  try {
    const users = await DB.get('users');
    const idx = users.findIndex(u => u.id === profile.id || u.email === profile.email);
    if (idx >= 0) { users[idx] = { ...users[idx], ...profile, needsProfileCompletion: false }; await DB.set('users', users); currentUser = users[idx]; }
    else { users.push(profile); await DB.set('users', users); currentUser = profile; }
    saveSession(currentUser.id, true);
    pendingGoogleUser = null; googleSelectedRole = null;
    closeModal();
    showAlert('تم حفظ البيانات!', 'success');
    launchConfetti(50);
    setTimeout(() => enterDashboard(), 400);
  } finally { hideLoading(); }
}

async function handleForgotPassword() {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  if (!email) { showAlert('أدخل بريدك أولاً', 'warning'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showAlert('البريد غير صالح'); return; }
  if (!firebaseAuthEnabled) { showAlert('غير متاح', 'warning'); return; }
  const btn = document.getElementById('forgotBtn');
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = 'جارٍ الإرسال...';
  try {
    await fbAuth.sendPasswordResetEmail(fbAuth.auth, email);
    showAlert(`✅ تم الإرسال إلى ${email}`, 'success');
  } catch (err) { showAlert('تعذر الإرسال'); }
  finally { btn.disabled = false; btn.textContent = orig; }
}

async function logout() {
  stopNotificationsListener();
  if (firebaseAuthEnabled && fbAuth) { try { await fbAuth.signOut(fbAuth.auth); } catch {} }
  currentUser = null;
  clearSession();
  showScreen('auth');
  document.getElementById('loginForm').reset();
  document.getElementById('registerForm').reset();
}

async function checkSession() {
  await handleGoogleRedirectResult();
  if (isProcessingRedirect) return false;
  if (firebaseAuthEnabled && fbAuth) {
    return new Promise((resolve) => {
      let done = false;
      const unsub = fbAuth.onAuthStateChanged(fbAuth.auth, async (user) => {
        if (done) return;
        done = true; unsub();
        if (user) {
          try {
            const users = await DB.get('users');
            let p = users.find(u => u.id === user.uid) || users.find(u => u.email && user.email && u.email.toLowerCase() === user.email.toLowerCase());
            if (!p) p = await ensureUserProfile(user, null);
            if (!p) { resolve(false); return; }
            if (user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() && p.role !== 'admin') {
              p.role = 'admin'; p.approved = true;
              const i = users.findIndex(u => u.id === p.id);
              if (i >= 0) users[i] = p; else users.push(p);
              await DB.set('users', users);
            }
            currentUser = p;
            saveSession(p.id, true);
            enterDashboard();
            resolve(true);
            return;
          } catch (e) {}
        }
        resolve(false);
      });
      setTimeout(() => { if (!done) { done = true; resolve(false); } }, 8000);
    });
  }
  const id = getSessionUserId();
  if (!id) return false;
  const users = await DB.get('users');
  const u = users.find(x => x.id === id);
  if (u) { currentUser = u; enterDashboard(); return true; }
  return false;
}

function enterDashboard() {
  if (platformSettings.maintenanceMode && !isAdmin(currentUser)) { showMaintenanceScreen(); return; }
  showScreen('dashboard');
  /* ✅ تحميل الإعلانات في كل الصفحات بعد تبديل الشاشة */
  loadActiveAnnouncement();
  updateHeader();
  updateNotifBadge();
  startNotificationsListener();
  if (currentUser.needsProfileCompletion && !isAdmin(currentUser)) {
    setTimeout(() => openProfileCompletionForExisting(), 500); return;
  }
  if (isAdmin(currentUser)) renderAdminDashboard();
  else if (currentUser.role === 'teacher') {
    if (currentUser.approved === false) renderPendingTeacherDashboard();
    else renderTeacherDashboard();
  } else if (currentUser.role === 'parent') renderParentDashboard();
  else renderStudentDashboard();
}

function updateHeader() {
  const av = document.getElementById('userAvatar');
  if (currentUser.photoURL) av.innerHTML = `<img src="${currentUser.photoURL}" alt="avatar" referrerpolicy="no-referrer">`;
  else av.textContent = isAdmin(currentUser) ? '👑' : (currentUser.role === 'teacher' ? '👨‍🏫' : currentUser.role === 'parent' ? '👨‍👩‍👦' : '👨‍🎓');
  document.getElementById('userName').textContent = currentUser.name;
  let meta = '';
  if (isAdmin(currentUser)) meta = '👑 مدير المنصة';
  else if (currentUser.role === 'teacher') meta = `مدرس • ${getSubjectName(currentUser.subject)}${currentUser.approved === false ? ' • ⏳ بانتظار الاعتماد' : ''}`;
  else if (currentUser.role === 'parent') meta = `👨‍👩‍👦 ولي أمر • ${(currentUser.children || []).length} أبناء`;
  else {
    const lvl = getLevel(currentUser.xp || 0);
    meta = `طالب • ${currentUser.grade || ''} • ${lvl.emoji} ${lvl.name} • ${currentUser.xp || 0} XP`;
  }
  document.getElementById('userMeta').textContent = meta;
}

async function updateNotifBadge() {
  if (!currentUser) return;
  const notifs = await DB.get('notifications');
  const my = notifs.filter(n => n.userId === currentUser.id && !n.read);
  const badge = document.getElementById('notifBadge');
  if (badge) { badge.style.display = my.length > 0 ? 'flex' : 'none'; badge.textContent = my.length; }
}
function startNotificationsListener() {
  stopNotificationsListener();
  if (!firebaseEnabled) return;
  try {
    notifUnsubscribe = DB.subscribe('notifications', (notifs) => {
      if (!currentUser) return;
      const my = notifs.filter(n => n.userId === currentUser.id && !n.read);
      const badge = document.getElementById('notifBadge');
      if (badge) { badge.style.display = my.length > 0 ? 'flex' : 'none'; badge.textContent = my.length; }
    });
  } catch (e) {}
}
function stopNotificationsListener() { if (notifUnsubscribe) { try { notifUnsubscribe(); } catch {} notifUnsubscribe = null; } }

async function openNotifications() {
  const notifs = (await DB.get('notifications')).filter(n => n.userId === currentUser.id).sort((a,b) => b.createdAt - a.createdAt);
  const unread = notifs.filter(n => !n.read);
  if (unread.length > 0) {
    const all = await DB.get('notifications');
    all.forEach(n => { if (n.userId === currentUser.id) n.read = true; });
    await DB.set('notifications', all);
    updateNotifBadge();
  }
  openModal(`<div class="modal-header"><h3 class="modal-title">🔔 الإشعارات</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    ${notifs.length === 0 ? `<div class="empty-state"><div class="empty-state-icon">🔔</div><h3>لا إشعارات</h3></div>` : notifs.map(n => `
      <div class="history-item" style="${n.read?'opacity:0.6':''}">
        <div class="history-info"><h4>${escapeHtml(n.title)}</h4><p>${escapeHtml(n.body)}</p><p style="font-size:11px;">${new Date(n.createdAt).toLocaleString('ar-EG')}</p></div>
      </div>
    `).join('')}`);
}

async function notifyStudents(quiz) {
  const users = await DB.get('users');
  const students = users.filter(u => u.role === 'student' && u.grade === quiz.grade);
  const notifs = await DB.get('notifications');
  students.forEach(s => notifs.push({ id: uid(), userId: s.id, title: 'اختبار جديد', body: `تم إضافة "${quiz.title}"`, createdAt: Date.now(), read: false }));
  await DB.set('notifications', notifs);
}

function switchUserTab(tab) { currentUserTab = tab; renderAdminDashboard(); }

function renderUsersListForTab(allUsers, allAttempts, tab) {
  let filtered = [], emptyMsg = '';
  if (tab === 'students') { filtered = allUsers.filter(u => u.role === 'student'); emptyMsg = 'لا يوجد طلاب'; }
  else if (tab === 'teachers') { filtered = allUsers.filter(u => u.role === 'teacher'); emptyMsg = 'لا يوجد مدرسون'; }
  else { filtered = allUsers.filter(u => u.role === 'parent'); emptyMsg = 'لا يوجد أولياء'; }
  if (filtered.length === 0) return `<div class="empty-state"><h3>${emptyMsg}</h3></div>`;

  const searchId = `search_${tab}`;
  const filterId = `filter_${tab}`;
  let filterOptions = '';
  if (tab === 'students') {
    const grades = [...new Set(filtered.map(u => u.grade).filter(Boolean))];
    filterOptions = `<option value="">كل السنوات</option>${grades.map(g => `<option value="${g}">${g}</option>`).join('')}`;
  } else if (tab === 'teachers') {
    filterOptions = `<option value="">كل الحالات</option><option value="approved">✅ معتمد</option><option value="pending">⏳ معلق</option>`;
  }
  filtered.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const headerHtml = `<div style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
    <input type="text" class="form-input auto-dir" id="${searchId}" placeholder="🔍 بحث بالاسم أو البريد..." style="flex:1; min-width:200px;" oninput="applyAdminFilters('${tab}')" dir="rtl">
    <select class="form-select" id="${filterId}" style="max-width:200px;" onchange="applyAdminFilters('${tab}')">${filterOptions}</select>
  </div>`;
  return headerHtml + `<div id="usersListBody_${tab}">${renderUsersBody(filtered, allAttempts, tab)}</div>`;
}

function renderUsersBody(filtered, allAttempts, tab) {
  if (filtered.length === 0) return `<div class="empty-state"><h3>لا نتائج</h3></div>`;
  return filtered.map(u => {
    if (tab === 'students') {
      const sAttempts = allAttempts.filter(a => a.studentId === u.id);
      const avg = sAttempts.length ? calculateAvg(sAttempts) : 0;
      const lvl = getLevel(u.xp || 0);
      return `<div class="student-row">
        <div class="student-info">
          <h4>${escapeHtml(u.name)} ${u.provider === 'google' ? '🔵' : ''}</h4>
          <p>${escapeHtml(u.email)} • ${escapeHtml(u.grade || '')} • ${escapeHtml(u.school || '')} • ${sAttempts.length} محاولة • متوسط ${avg}%</p>
          <p style="font-size:11px;">${lvl.emoji} ${lvl.name} • ${u.xp || 0} XP • 🔥 ${u.streak || 0} • 🏆 ${(u.badges || []).length}</p>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <span class="badge badge-${avg>=80?'success':avg>=50?'warning':'danger'}">${avg}%</span>
          <button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}')">🗑</button>
        </div>
      </div>`;
    } else if (tab === 'teachers') {
      const ratings = u.ratings || [];
      const avgR = ratings.length ? (ratings.reduce((a, r) => a + r.stars, 0) / ratings.length).toFixed(1) : '0';
      return `<div class="student-row">
        <div class="student-info">
          <h4>${escapeHtml(u.name)} ${isAdmin(u) ? '<span class="admin-badge">👑</span>' : ''} ${u.approved === false ? '<span class="badge badge-warning">⏳ معلق</span>' : ''}</h4>
          <p>${escapeHtml(u.email)} • ${getSubjectName(u.subject)} • ⭐ ${avgR} (${ratings.length})</p>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${u.approved === false ? `<button class="btn btn-sm btn-success" onclick="approveTeacher('${u.id}')">✅ اعتماد</button>` : ''}
          ${!isAdmin(u) ? `<button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}')">🗑</button>` : ''}
        </div>
      </div>`;
    } else {
      return `<div class="student-row">
        <div class="student-info"><h4>${escapeHtml(u.name)}</h4><p>${escapeHtml(u.email)} • ${(u.children || []).length} أبناء</p></div>
        <button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}')">🗑</button>
      </div>`;
    }
  }).join('');
}

async function applyAdminFilters(tab) {
  const query = (document.getElementById(`search_${tab}`)?.value || '').trim().toLowerCase();
  const filterVal = document.getElementById(`filter_${tab}`)?.value || '';
  const allUsers = await DB.get('users');
  const allAttempts = await DB.get('attempts');
  let filtered = [];
  if (tab === 'students') filtered = allUsers.filter(u => u.role === 'student');
  else if (tab === 'teachers') filtered = allUsers.filter(u => u.role === 'teacher');
  else filtered = allUsers.filter(u => u.role === 'parent');
  if (query) filtered = filtered.filter(u => (u.name || '').toLowerCase().includes(query) || (u.email || '').toLowerCase().includes(query));
  if (filterVal) {
    if (tab === 'students') filtered = filtered.filter(u => u.grade === filterVal);
    else if (tab === 'teachers') {
      if (filterVal === 'approved') filtered = filtered.filter(u => u.approved !== false);
      if (filterVal === 'pending') filtered = filtered.filter(u => u.approved === false);
    }
  }
  filtered.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const body = document.getElementById(`usersListBody_${tab}`);
  if (body) body.innerHTML = renderUsersBody(filtered, allAttempts, tab);
}

function renderAdminQuizzesList(quizzes, teachers, attempts) {
  if (quizzes.length === 0) return `<div class="card"><div class="empty-state"><div class="empty-state-icon">📝</div><h3>لا يوجد اختبارات</h3></div></div>`;
  return quizzes.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).map(quiz => {
    const teacher = teachers.find(t => t.id === quiz.teacherId);
    const qa = attempts.filter(a => a.quizId === quiz.id);
    const avg = qa.length ? calculateAvg(qa) : 0;
    return `<div class="card" style="border-right:4px solid var(--primary);">
      <h3 style="font-size:18px; font-weight:800; margin-bottom:8px;">${getSubjectEmoji(quiz.subject)} ${escapeHtml(quiz.title)}</h3>
      <p style="font-size:13px; color:var(--text-light); margin-bottom:12px;">${getSubjectName(quiz.subject)} • ${escapeHtml(quiz.grade)} • المدرس: ${escapeHtml(teacher?.name || 'محذوف')}</p>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
        <span class="badge badge-primary">${quiz.questions.length} سؤال</span>
        <span class="badge badge-info">⏱️ ${quiz.timePerQuestion || 30}ث</span>
        <span class="badge badge-success">${qa.length} محاولة</span>
        <span class="badge badge-${avg >= 80 ? 'success' : avg >= 50 ? 'warning' : 'danger'}">متوسط ${avg}%</span>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-sm btn-outline" onclick="viewQuizDetails('${quiz.id}')">👁️ عرض</button>

      </div>
    </div>`;
  }).join('');
}

async function filterAdminQuizzes() {
  const query = document.getElementById('quizSearchInput').value.trim().toLowerCase();
  const allQuizzes = await DB.get('quizzes');
  const allUsers = await DB.get('users');
  const allAttempts = await DB.get('attempts');
  const teachers = allUsers.filter(u => u.role === 'teacher');
  let filtered = allQuizzes;
  if (query) filtered = allQuizzes.filter(q => {
    const t = teachers.find(x => x.id === q.teacherId);
    return q.title.toLowerCase().includes(query) || (t?.name || '').toLowerCase().includes(query);
  });
  document.getElementById('adminQuizzesList').innerHTML = renderAdminQuizzesList(filtered, teachers, allAttempts);
}

    <h4 style="margin:16px 0 12px;">📋 الأسئلة</h4>
    ${quiz.questions.map((q, i) => {
      const ti = QUESTION_TYPES[q.type] || QUESTION_TYPES.mcq;

      return `<div class="question-item">
        <div class="question-item-header">

}

async function adminDeleteQuiz(quizId) {
  if (!confirm('⚠️ حذف الاختبار وجميع محاولاته؟')) return;
  if (prompt('اكتب "حذف" للتأكيد:') !== 'حذف') { alert('ألغي'); return; }
  showLoading();
  try {
    const quizzes = await DB.get('quizzes');
    const quiz = quizzes.find(q => q.id === quizId);
    await DB.set('quizzes', quizzes.filter(q => q.id !== quizId));
    await DB.set('attempts', (await DB.get('attempts')).filter(a => a.quizId !== quizId));
    await logActivity('حذف اختبار (أدمن)', quiz?.title || quizId);
    alert('✅ تم الحذف');
    renderAdminQuizzes();
  } finally { hideLoading(); }
}

      </div>
      <div class="chart-container" style="height:340px;"><canvas id="usersGrowthChart"></canvas></div>
      <div class="chart-container" style="height:340px;"><canvas id="attemptsChart"></canvas></div>
      <div class="chart-container" style="height:340px;"><canvas id="gradeDistChart"></canvas></div>
      <div class="chart-container" style="height:340px;"><canvas id="topTeachersChart"></canvas></div>
    `;
    const labels7 = [], users7 = [], attempts7 = [];
    for (let i = 6; i >= 0; i--) {
      const date = new Date(); date.setDate(date.getDate() - i); date.setHours(0, 0, 0, 0);
      const next = new Date(date); next.setDate(next.getDate() + 1);
      labels7.push(date.toLocaleDateString('ar-EG', { weekday: 'short', day: 'numeric' }));
      users7.push(allUsers.filter(u => u.createdAt >= date.getTime() && u.createdAt < next.getTime()).length);
      attempts7.push(allAttempts.filter(a => a.createdAt >= date.getTime() && a.createdAt < next.getTime()).length);
    }
    const c1 = document.getElementById('usersGrowthChart')?.getContext('2d');
    if (c1) new Chart(c1, { type: 'line', data: { labels: labels7, datasets: [{ label: 'مستخدمون جدد', data: users7, borderColor: '#4f46e5', backgroundColor: 'rgba(79,70,229,0.15)', fill: true, tension: 0.4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: 'نمو المستخدمين (7 أيام)', font: { size: 16, weight: 'bold' } } } } });
    const c2 = document.getElementById('attemptsChart')?.getContext('2d');
    if (c2) new Chart(c2, { type: 'bar', data: { labels: labels7, datasets: [{ label: 'محاولات', data: attempts7, backgroundColor: 'rgba(16,185,129,0.7)', borderRadius: 8 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: 'المحاولات اليومية', font: { size: 16, weight: 'bold' } } } } });
    const dist = { 'ممتاز (90+)': 0, 'جيد جداً (80-89)': 0, 'جيد (70-79)': 0, 'مقبول (50-69)': 0, 'ضعيف (<50)': 0 };
    allAttempts.forEach(a => {
      const pct = a.total > 0 ? Math.round((a.score / a.total) * 100) : 0;
      if (pct >= 90) dist['ممتاز (90+)']++;
      else if (pct >= 80) dist['جيد جداً (80-89)']++;
      else if (pct >= 70) dist['جيد (70-79)']++;
      else if (pct >= 50) dist['مقبول (50-69)']++;
      else dist['ضعيف (<50)']++;
    });
    const c3 = document.getElementById('gradeDistChart')?.getContext('2d');
    if (c3) new Chart(c3, { type: 'doughnut', data: { labels: Object.keys(dist), datasets: [{ data: Object.values(dist), backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#64748b'] }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: 'توزيع الدرجات', font: { size: 16, weight: 'bold' } } } } });
    const teachers = allUsers.filter(u => u.role === 'teacher');
    const topT = teachers.map(t => {
      const r = t.ratings || [];
      return { name: t.name, avg: r.length ? parseFloat((r.reduce((a, x) => a + x.stars, 0) / r.length).toFixed(1)) : 0 };
    }).sort((a, b) => b.avg - a.avg).slice(0, 5);
    const c4 = document.getElementById('topTeachersChart')?.getContext('2d');
    if (c4) new Chart(c4, { type: 'bar', data: { labels: topT.map(t => t.name.length > 15 ? t.name.slice(0, 15) + '...' : t.name), datasets: [{ label: 'متوسط التقييم', data: topT.map(t => t.avg), backgroundColor: 'rgba(245,158,11,0.7)', borderRadius: 8 }] }, options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y', plugins: { title: { display: true, text: 'أفضل 5 مدرسين', font: { size: 16, weight: 'bold' } }, legend: { display: false } }, scales: { x: { beginAtZero: true, max: 5 } } } });
  } finally { hideLoading(); }
}

async function grantXpToStudent(studentId) {
  const amount = parseInt(document.getElementById('grantXPAmount').value) || 0;
  const reason = document.getElementById('grantXPReason').value.trim() || 'مكافأة';
  if (amount <= 0) { alert('أدخل عدداً صحيحاً'); return; }
  showLoading();
  try {
    await awardXP(studentId, amount, reason);
    await logActivity('منح XP', `${amount} نقطة`);
    launchConfetti(20);
    alert(`✅ تم منح ${amount} XP`);
    closeModal();
    renderAdminGamification();
  } finally { hideLoading(); }
}

async function openStudentGamificationDetails(studentId) {
  const users = await DB.get('users');
  const u = users.find(x => x.id === studentId);
  if (!u) return;
  const lvl = getLevel(u.xp || 0);
  const next = getNextLevel(u.xp || 0);
  const badges = u.badges || [];
  const allBadges = Object.keys(BADGES);
  openModal(`<div class="modal-header"><h3 class="modal-title">${escapeHtml(u.name)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="alert alert-info">${lvl.emoji} <strong>${lvl.name}</strong> • ${u.xp || 0} XP<br>🔥 سلسلة: ${u.streak || 0} يوم • 🏆 ${badges.length} شارة${next ? `<br>⏭️ التالي: ${next.emoji} ${next.name} (${next.minXP} XP)` : '<br>👑 وصل للأعلى!'}</div>
    <h4 style="margin:16px 0 12px;">🏅 الشارات</h4>
    <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:8px;">
      ${allBadges.map(key => {
        const has = badges.includes(key);
        const b = BADGES[key];
        return `<div style="text-align:center; padding:8px; background:var(--bg); border-radius:8px; ${has ? 'border:2px solid var(--gold)' : 'opacity:0.4;'}">
          <div style="font-size:24px;">${b.emoji}</div>
          <div style="font-size:10px; font-weight:800;">${b.name}</div>
          ${has ? `<button class="btn btn-sm btn-danger" onclick="removeBadgeFromStudent('${studentId}', '${key}')" style="margin-top:4px; font-size:10px; padding:2px 6px;">حذف</button>` : ''}
        </div>`;
      }).join('')}
    </div>
    <h4 style="margin:16px 0 12px;">➕ منح شارة يدوياً</h4>
    <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:8px;">
      ${allBadges.filter(k => !badges.includes(k)).map(key => {
        const b = BADGES[key];
        return `<button class="btn btn-outline btn-sm" onclick="awardBadgeManually('${studentId}', '${key}')">${b.emoji} ${b.name}</button>`;
      }).join('') || '<p style="font-size:13px;color:var(--text-light);">حصل على كل الشارات!</p>'}
    </div>`);
}

async function awardBadgeManually(studentId, badgeKey) {
  showLoading();
  try {
    const users = await DB.get('users');
    const idx = users.findIndex(u => u.id === studentId);
    if (idx < 0) return;
    if (!users[idx].badges) users[idx].badges = [];
    if (!users[idx].badges.includes(badgeKey)) {
      users[idx].badges.push(badgeKey);
      await DB.set('users', users);
      const notifs = await DB.get('notifications');
      notifs.push({ id: uid(), userId: studentId, title: `🏆 شارة: ${BADGES[badgeKey].name}`, body: BADGES[badgeKey].desc, createdAt: Date.now(), read: false });
      await DB.set('notifications', notifs);
      launchConfetti(20);
      alert('✅ تم منح الشارة');
      closeModal();
      renderAdminGamification();
    }
  } finally { hideLoading(); }
}

async function removeBadgeFromStudent(studentId, badgeKey) {
  if (!confirm('حذف هذه الشارة؟')) return;
  showLoading();
  try {
    const users = await DB.get('users');
    const idx = users.findIndex(u => u.id === studentId);
    if (idx < 0) return;
    users[idx].badges = (users[idx].badges || []).filter(b => b !== badgeKey);
    await DB.set('users', users);
    await logActivity('حذف شارة', badgeKey);
    alert('تم الحذف');
    closeModal();
    renderAdminGamification();
  } finally { hideLoading(); }
}

async function resetStudentGamification(studentId) {
  if (!confirm('⚠️ تصفير XP والشارات والسلسلة؟')) return;
  showLoading();
  try {
    const users = await DB.get('users');
    const idx = users.findIndex(u => u.id === studentId);

/* ✅ إصلاح: رفع صورة الإعلان مع ضغط تلقائي */
async function handleAnnImageUpload(e) {
  const originalFile = e.target.files[0]; if (!originalFile) return;
  if (!originalFile.type.startsWith('image/')) { alert('اختر صورة فقط'); e.target.value = ''; return; }
  const sizeCheck = validateFileSize(originalFile, MAX_IMAGE_SIZE_MB, 'الصورة');
  if (!sizeCheck.ok) { alert(sizeCheck.msg); e.target.value = ''; return; }

  showLoading();
  try {
    /* ضغط الصورة */
    let file;
    try { file = await compressImage(originalFile); }
    catch (err) { file = originalFile; }

    if (!firebaseStorageEnabled) {
      if (file.size > 800 * 1024) { alert('Storage غير مفعّل، الحد بعد الضغط 800KB'); e.target.value = ''; hideLoading(); return; }
      const r = new FileReader();
      r.onload = (ev) => {
        _tempAnnImage = ev.target.result;
        _tempAnnImagePath = null;
        document.getElementById('annImagePreview').innerHTML = `<img src="${ev.target.result}" style="max-width:100%;max-height:160px;border-radius:10px;">`;
      };
      r.readAsDataURL(file);
      hideLoading();
      return;
    }

    const path = `announcements/${Date.now()}_${file.name}`;
    const storageRef = fbStorage.ref(fbStorage.storage, path);
    await fbStorage.uploadBytes(storageRef, file);
    const downloadURL = await fbStorage.getDownloadURL(storageRef);
    _tempAnnImage = downloadURL;
    _tempAnnImagePath = path;
    document.getElementById('annImagePreview').innerHTML = `<img src="${downloadURL}" style="max-width:100%;max-height:160px;border-radius:10px;">`;
    alert(`✅ تم رفع الصورة (${(file.size/1024).toFixed(0)}KB). اضغط "حفظ" للتأكيد.`);
  } catch (err) { alert('فشل الرفع: ' + err.message); }
  finally { hideLoading(); }
}

function removeAnnImage() {
  _tempAnnImage = null;
  _tempAnnImagePath = null;
  document.getElementById('annImagePreview').innerHTML = '<div style="padding:20px;background:var(--bg);border-radius:10px;color:var(--text-light);">لا توجد صورة</div>';
  const fi = document.getElementById('annImageFile'); if (fi) fi.value = '';
}

async function saveAnnouncement(id) {
  const emoji = document.getElementById('annEmoji').value.trim() || '📢';
  const title = document.getElementById('annTitle').value.trim();
  const text = document.getElementById('annText').value.trim();
  const link = document.getElementById('annLink').value.trim();
  const linkText = document.getElementById('annLinkText').value.trim();
  const bgColor = document.getElementById('annColor').value;
  const bgColorEnd = document.getElementById('annColorEnd').value;
  const startDate = document.getElementById('annStart').value;
  const endDate = document.getElementById('annEnd').value;
  const type = window._currentAnnType || 'bar';
  const imageUrl = _tempAnnImage || null;
  const imagePath = _tempAnnImagePath || null;

  if (!text) { alert('أدخل نص الإعلان'); return; }

  showLoading();
  try {
    const announcements = await DB.get('announcements');
    if (id) {
      const idx = announcements.findIndex(a => a.id === id);
      if (idx >= 0) {
        if (announcements[idx].imagePath && announcements[idx].imagePath !== imagePath && firebaseStorageEnabled) {
          try { await fbStorage.deleteObject(fbStorage.ref(fbStorage.storage, announcements[idx].imagePath)); } catch (e) {}
        }
        announcements[idx] = { ...announcements[idx], emoji, title, text, link, linkText, bgColor, bgColorEnd, type, imageUrl, imagePath, startDate: startDate ? new Date(startDate).getTime() : null, endDate: endDate ? new Date(endDate).getTime() : null, updatedAt: Date.now() };
      }
    } else {
      announcements.push({ id: uid(), emoji, title, text, link, linkText, bgColor, bgColorEnd, type, imageUrl, imagePath, startDate: startDate ? new Date(startDate).getTime() : null, endDate: endDate ? new Date(endDate).getTime() : null, enabled: true, createdAt: Date.now() });
    }
    await DB.set('announcements', announcements);
    _cachedAnnouncements = announcements;
    await logActivity(id ? 'تعديل إعلان' : 'إنشاء إعلان', title || text.slice(0, 30));
    launchConfetti(20);
    alert('✅ تم الحفظ');
    closeModal();
    /* ✅ إعادة رسم الإعلانات فوراً في كل الصفحات */
    renderAnnouncementEverywhere();
    renderAdminAnnouncements();
  } finally { hideLoading(); }
}

async function toggleAnnouncement(id) {
  showLoading();
  try {
    const announcements = await DB.get('announcements');
    const idx = announcements.findIndex(a => a.id === id);
    if (idx >= 0) {
      announcements[idx].enabled = !announcements[idx].enabled;
      await DB.set('announcements', announcements);
      _cachedAnnouncements = announcements;
      renderAnnouncementEverywhere();
      renderAdminAnnouncements();
    }
  } finally { hideLoading(); }
}

async function deleteAnnouncement(id) {
  if (!confirm('حذف الإعلان؟')) return;
  showLoading();
  try {
    const announcements = await DB.get('announcements');
    const ann = announcements.find(a => a.id === id);
    if (ann?.imagePath && firebaseStorageEnabled) {
      try { await fbStorage.deleteObject(fbStorage.ref(fbStorage.storage, ann.imagePath)); } catch (e) {}
    }
    const filtered = announcements.filter(a => a.id !== id);
    await DB.set('announcements', filtered);
    _cachedAnnouncements = filtered;
    await logActivity('حذف إعلان', id);
    alert('تم الحذف');
    renderAnnouncementEverywhere();
    renderAdminAnnouncements();
  } finally { hideLoading(); }
}

  const body = document.getElementById('adminBroadcastBody').value.trim();
  if (!title || !body) { alert('أكمل البيانات'); return; }
  showLoading();
  try {
    const users = await DB.get('users');
    let recipients = users;
    if (target !== 'all') recipients = users.filter(u => u.role === target);
    if (recipients.length === 0) { alert('لا يوجد مستلمون'); return; }

    recipients.forEach(r => notifs.push({ id: uid(), userId: r.id, title: `📢 ${title}`, body, createdAt: Date.now(), read: false }));
    await DB.set('notifications', notifs);
    await logActivity('إشعار شامل', `${title} → ${target} (${recipients.length})`);
    launchConfetti(30);
    alert(`✅ أُرسل إلى ${recipients.length} مستخدم`);
    closeModal();
  } finally { hideLoading(); }
}

async function openPendingTeachers() {

  const pending = users.filter(u => u.role === 'teacher' && u.approved === false);
  if (pending.length === 0) { openModal(`<div class="modal-header"><h3 class="modal-title">⏳ المعلقون</h3><button class="modal-close" onclick="closeModal()">✕</button></div><div class="empty-state"><h3>لا يوجد معلقون</h3></div>`); return; }

async function approveTeacher(userId) {
  showLoading();
  try {
    const users = await DB.get('users');
    const idx = users.findIndex(u => u.id === userId);
    if (idx >= 0) {
      users[idx].approved = true;
      await DB.set('users', users);
      const notifs = await DB.get('notifications');
      notifs.push({ id: uid(), userId, title: '✅ تم اعتماد حسابك', body: 'تم اعتماد حسابك كمدرس.', createdAt: Date.now(), read: false });
      await DB.set('notifications', notifs);
      await logActivity('اعتماد مدرس', users[idx].name);
      launchConfetti(30);
      alert('تم الاعتماد');
      closeModal();
      renderAdminDashboard();
    }
  } finally { hideLoading(); }
}

async function deleteUser(userId) {
  if (!confirm('حذف المستخدم نهائياً؟')) return;
  showLoading();
  try {
    const users = await DB.get('users');
    const user = users.find(u => u.id === userId);
    if (isAdmin(user)) { alert('لا يمكن حذف الأدمن'); return; }
    await DB.set('users', users.filter(u => u.id !== userId));
    await DB.set('attempts', (await DB.get('attempts')).filter(a => a.studentId !== userId));
    await logActivity('حذف مستخدم', user?.name || userId);
    alert('تم الحذف');
    renderAdminDashboard();
  } finally { hideLoading(); }
}

async function wipeQuizData() {
  if (!isAdmin(currentUser)) { alert('غير مصرح'); return; }
  if (!confirm('⚠️ سيتم حذف: الاختبارات، المحاولات، الإشعارات.\nمتابعة؟')) return;
  if (prompt('اكتب "حذف":') !== 'حذف') { alert('ألغي'); return; }
  showLoading();
  try {
    await DB.set('quizzes', []);
    await DB.set('attempts', []);
    await DB.set('notifications', []);
    await logActivity('مسح شامل', 'الاختبارات والمحاولات');
    alert('✅ تم المسح');
    renderAdminDashboard();
  } finally { hideLoading(); }
}

      <div class="teacher-profile-header">

        </div>

        <div class="stat-card"><div class="stat-icon success">✅</div><div class="stat-info"><h4>${attempts.length}</h4><p>محاولات</p></div></div>

        </div>

function renderQuizCard(quiz) {
  const tc = {};
  quiz.questions.forEach(q => { const t = q.type || 'mcq'; tc[t] = (tc[t] || 0) + 1; });
  const typeLabels = Object.entries(tc).map(([t, c]) => { const i = QUESTION_TYPES[t] || QUESTION_TYPES.mcq; return `<span class="badge qtype-${t}">${i.emoji} ${c}</span>`; }).join(' ');
  return `<div class="subject-card" onclick="openQuizManage('${quiz.id}')">
    <div class="subject-emoji">${getSubjectEmoji(quiz.subject)}</div>
    <div class="subject-name">${escapeHtml(quiz.title)}</div>
    <div class="subject-meta">${getSubjectName(quiz.subject)} • ${escapeHtml(quiz.grade)}</div>
    <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;">${typeLabels}</div>
    <div class="subject-footer">
      <span class="badge badge-primary">${quiz.questions.length} سؤال</span>
      <span class="badge badge-info">⏱️ ${quiz.timePerQuestion || 30}ث</span>
    </div>
  </div>`;
}

function renderStudentsList(students, allAttempts) {
  const bySchool = {};
  students.forEach(s => { const k = s.school || 'غير محدد'; if (!bySchool[k]) bySchool[k] = []; bySchool[k].push(s); });
  return `<div class="card">${Object.entries(bySchool).map(([school, list]) => `<div style="margin-bottom:16px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
      <span class="badge badge-info">🏫 ${escapeHtml(school)}</span>
      <span class="badge badge-primary">${list.length} طالب</span>
    </div>
    ${list.map(s => {
      const sAttempts = allAttempts.filter(a => a.studentId === s.id);
      const avg = sAttempts.length ? calculateAvg(sAttempts) : 0;
      const lvl = getLevel(s.xp || 0);
      return `<div class="student-row">
        <div class="student-info"><h4>${escapeHtml(s.name)} ${s.provider === 'google' ? '🔵' : ''} <span class="badge badge-purple">${lvl.emoji}</span></h4><p>${escapeHtml(s.grade || '')} • ${sAttempts.length} محاولة • ${s.xp || 0} XP</p></div>
        <span class="badge badge-${avg>=80?'success':avg>=50?'warning':'danger'}">${avg}%</span>
      </div>`;
    }).join('')}
  </div>`).join('')}</div>`;
}

function renderLeaderboard(users, attempts) {
  const students = users.filter(u => u.role === 'student');
  const stats = students.map(s => {
    const sa = attempts.filter(a => a.studentId === s.id);
    return { ...s, avg: sa.length ? calculateAvg(sa) : 0, attemptCount: sa.length, xp: s.xp || 0 };
  }).filter(s => s.attemptCount > 0 || s.xp > 0).sort((a, b) => b.xp - a.xp || b.avg - a.avg).slice(0, 20);
  if (stats.length === 0) return `<div class="card"><div class="empty-state"><h3>لا يوجد بيانات</h3></div></div>`;
  return `<div class="card">${stats.map((s, i) => {
    const lvl = getLevel(s.xp);
    return `<div class="leaderboard-item ${i < 3 ? 'rank-' + (i+1) : ''}">
      <div class="leaderboard-rank">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i+1}</div>
      <div class="leaderboard-info"><h4>${escapeHtml(s.name)} ${s.provider === 'google' ? '🔵' : ''} ${lvl.emoji}</h4><p>${escapeHtml(s.grade || '')} • ${s.attemptCount} محاولة • ${lvl.name}</p></div>
      <div class="leaderboard-score">${s.xp} XP</div>
    </div>`;
  }).join('')}</div>`;
}

async function sendBroadcast() {
  const target = document.querySelector('input[name="bTarget"]:checked').value;
  const grade = document.getElementById('bGradeValue').value;
  const title = document.getElementById('bTitle').value.trim();
  const body = document.getElementById('bBody').value.trim();
  if (!title || !body) { alert('أكمل البيانات'); return; }
  if (target === 'grade' && !grade) { alert('اختر السنة'); return; }
  showLoading();
  try {
    const users = await DB.get('users');
    let recipients = users.filter(u => u.role === 'student');
    if (target === 'grade') recipients = recipients.filter(u => u.grade === grade);
    if (recipients.length === 0) { alert('لا يوجد طلاب'); return; }
    const notifs = await DB.get('notifications');
    recipients.forEach(r => notifs.push({ id: uid(), userId: r.id, title: `📢 ${title}`, body, createdAt: Date.now(), read: false }));
    await DB.set('notifications', notifs);
    await logActivity('إشعار مدرس', title);
    launchConfetti(30);
    alert(`✅ أُرسل إلى ${recipients.length} طالب`);
    closeModal();
  } finally { hideLoading(); }
}

async function renderAttemptsList(attempts) {
  if (!attempts.length) return '<div class="card"><div class="empty-state"><h3>لا نتائج</h3></div></div>';
  const allQuizzes = await DB.get('quizzes'), allUsers = await DB.get('users');
  return `<div class="card">${attempts.map(a => {
    const quiz = allQuizzes.find(q => q.id === a.quizId);
    const student = allUsers.find(u => u.id === a.studentId);
    if (!quiz || !student) return '';
    const pct = a.total > 0 ? Math.round((a.score / a.total) * 100) : 0;
    const pending = a.needsGrading && !a.graded;
    return `<div class="history-item">
      <div class="history-info"><h4>${escapeHtml(student.name)}</h4><p>${escapeHtml(quiz.title)} • ${new Date(a.createdAt).toLocaleDateString('ar-EG')}</p></div>
      ${pending ? `<span class="pending-badge"><span class="pending-dot"></span> للتصحيح</span>` : ''}
      <div class="history-score">${a.score}/${a.total}</div>
      <span class="badge badge-${pct>=80?'success':pct>=50?'warning':'danger'}">${pct}%</span>
    </div>`;
  }).join('')}</div>`;
}

      </div>
      ${myBadges.length > 0 ? `<div class="section-header"><div><h2 class="section-title">🏅 شاراتي</h2></div></div>
        <div class="badges-grid">${myBadges.map(b => `<div class="badge-card earned"><div class="badge-emoji">${BADGES[b].emoji}</div><div class="badge-name">${BADGES[b].name}</div></div>`).join('')}</div>` : ''}
      ${completedQuizzes.length > 0 ? `<div class="card" style="border-right:4px solid var(--success); background: var(--success-light);">

      new Chart(ctx, { type: 'line', data: { labels, datasets: [{ label: 'درجاتك %', data, borderColor: '#4f46e5', backgroundColor: 'rgba(79,70,229,0.1)', fill: true, tension: 0.4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100 } } } });

function renderStudentQuizCard(quiz, myAttempts) {
  if (myAttempts.some(a => a.quizId === quiz.id)) return '';
  return `<div class="subject-card" onclick="startQuiz('${quiz.id}')">
    <div class="subject-emoji">${getSubjectEmoji(quiz.subject)}</div>
    <div class="subject-name">${escapeHtml(quiz.title)}</div>
    <div class="subject-meta">${getSubjectName(quiz.subject)} • ${quiz.questions.length} سؤال</div>
    <div class="subject-footer"><span class="badge badge-primary">ابدأ</span></div>
  </div>`;
}

async function searchChild() {
  const query = document.getElementById('childSearchInput').value.trim().toLowerCase();
  if (!query) { alert('أدخل البريد أو الهاتف'); return; }
  showLoading();
  try {
    const users = await DB.get('users');
    const student = users.find(u => u.role === 'student' && (u.email?.toLowerCase() === query || u.parentPhone === query));
    if (!student) { alert('❌ لم يتم العثور على طالب'); return; }
    if ((currentUser.children || []).includes(student.id)) { alert('⚠️ مرتبط بالفعل'); return; }
    if (!currentUser.children) currentUser.children = [];
    currentUser.children.push(student.id);
    const userIdx = users.findIndex(u => u.id === currentUser.id);
    if (userIdx >= 0) { users[userIdx].children = currentUser.children; await DB.set('users', users); }
    launchConfetti(30);
    alert(`✅ تم ربط ${student.name}`);
    renderParentDashboard();
  } finally { hideLoading(); }
}

async function removeChild(childId) {
  if (!confirm('إلغاء الربط؟')) return;
  showLoading();
  try {
    currentUser.children = (currentUser.children || []).filter(id => id !== childId);
    const users = await DB.get('users');
    const userIdx = users.findIndex(u => u.id === currentUser.id);
    if (userIdx >= 0) { users[userIdx].children = currentUser.children; await DB.set('users', users); }
    alert('✅ تم الإلغاء');
    renderParentDashboard();
  } finally { hideLoading(); }
}

/* ✅ إصلاح: رفع الصورة الشخصية مع ضغط */
async function handleAvatarUpload(e) {
  const originalFile = e.target.files[0]; if (!originalFile) return;
  if (!originalFile.type.startsWith('image/')) { alert('اختر صورة فقط'); e.target.value = ''; return; }
  const sizeCheck = validateFileSize(originalFile, MAX_AVATAR_SIZE_MB, 'الصورة');
  if (!sizeCheck.ok) { alert(sizeCheck.msg); e.target.value = ''; return; }
  showLoading();
  try {
    let file;
    try { file = await compressImage(originalFile, 600, 0.85); }
    catch (err) { file = originalFile; }

    if (!firebaseStorageEnabled) {
      if (file.size > 800 * 1024) { alert('Storage غير مفعّل، الحد بعد الضغط 800KB'); e.target.value = ''; hideLoading(); return; }
      const r = new FileReader();
      r.onload = (ev) => { _tempAvatar = ev.target.result; document.getElementById('avatarPreview').innerHTML = `<img src="${ev.target.result}">`; };
      r.readAsDataURL(file);
      hideLoading();
      return;
    }
    const path = `avatars/${currentUser.id}_${Date.now()}.jpg`;
    const storageRef = fbStorage.ref(fbStorage.storage, path);
    await fbStorage.uploadBytes(storageRef, file);
    const downloadURL = await fbStorage.getDownloadURL(storageRef);
    _tempAvatar = downloadURL;
    document.getElementById('avatarPreview').innerHTML = `<img src="${downloadURL}">`;
    alert(`✅ تم الرفع (${(file.size/1024).toFixed(0)}KB). اضغط "حفظ" للتأكيد.`);
  } catch (err) { alert('فشل الرفع: ' + err.message); }
  finally { hideLoading(); }
}

function removeAvatar() {
  _tempAvatar = null;
  document.getElementById('avatarPreview').innerHTML = '👨‍🏫';

/* ✅ إصلاح: رفع الملازم مع التحقق من الحجم */
async function handleMaterialUpload(e) {
  const f = e.target.files[0]; if (!f) return;
  const sizeCheck = validateFileSize(f, MAX_MATERIAL_SIZE_MB, 'الملف');
  if (!sizeCheck.ok) { alert(sizeCheck.msg); e.target.value = ''; return; }

  if (firebaseStorageEnabled) {
    showLoading();
    try {
      const path = `materials/${currentUser.id}/${Date.now()}_${f.name}`;
      const storageRef = fbStorage.ref(fbStorage.storage, path);
      await fbStorage.uploadBytes(storageRef, f);
      const downloadURL = await fbStorage.getDownloadURL(storageRef);
      const users = await DB.get('users');
      const idx = users.findIndex(u => u.id === currentUser.id);
      if (idx >= 0) {
        if (!users[idx].materialFiles) users[idx].materialFiles = [];
        users[idx].materialFiles.push({ name: f.name, size: f.size, type: f.type, url: downloadURL, storagePath: path, uploadedAt: Date.now() });
        await DB.set('users', users);
        currentUser = users[idx];
        await logActivity('رفع ملزمة', f.name);
        launchConfetti(10);
        alert(`✅ تم رفع "${f.name}"`);
        renderContentModal('materials');
      }
    } catch (err) { alert('فشل الرفع: ' + err.message); }
    finally { hideLoading(); }
    return;
  }
  if (f.size > 500 * 1024) { alert('Storage غير مفعّل، الحد 500KB'); e.target.value = ''; return; }
  showLoading();
  try {
    const base64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = (ev) => res(ev.target.result); r.onerror = rej; r.readAsDataURL(f); });
    const users = await DB.get('users');
    const idx = users.findIndex(u => u.id === currentUser.id);
    if (idx >= 0) {
      if (!users[idx].materialFiles) users[idx].materialFiles = [];
      users[idx].materialFiles.push({ name: f.name, size: f.size, type: f.type, data: base64, uploadedAt: Date.now() });
      await DB.set('users', users);
      currentUser = users[idx];
      renderContentModal('materials');
    }
  } finally { hideLoading(); }
}

async function removeMaterial(index) {
  if (!confirm('حذف هذه الملزمة؟')) return;
  showLoading();
  try {
    const users = await DB.get('users');
    const idx = users.findIndex(u => u.id === currentUser.id);
    if (idx >= 0 && users[idx].materialFiles) {
      const m = users[idx].materialFiles[index];
      if (m.storagePath && firebaseStorageEnabled) { try { await fbStorage.deleteObject(fbStorage.ref(fbStorage.storage, m.storagePath)); } catch (e) {} }
      users[idx].materialFiles.splice(index, 1);
      await DB.set('users', users);
      currentUser = users[idx];
      renderContentModal('materials');
    }
  } finally { hideLoading(); }
}

function downloadMaterial(index) {
  const m = (currentUser.materialFiles || [])[index];
  if (!m) return;
  if (m.url) window.open(m.url, '_blank');
  else if (m.data) {
    const a = document.createElement('a');
    a.href = m.data; a.download = m.name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }
}

async function downloadTeacherMaterial(teacherId, index) {
  const users = await DB.get('users');
  const t = users.find(u => u.id === teacherId);
  if (!t || !t.materialFiles || !t.materialFiles[index]) return;
  const m = t.materialFiles[index];
  if (m.url) window.open(m.url, '_blank');
  else if (m.data) {
    const a = document.createElement('a');
    a.href = m.data; a.download = m.name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }
}

/* ============ TEACHER CARD + RATING ============ */
function renderTeacherCard(teacher, showRateButton = true) {
  const ratings = teacher.ratings || [];
  const avg = ratings.length ? (ratings.reduce((a, r) => a + r.stars, 0) / ratings.length).toFixed(1) : '0';
  const fullStars = Math.round(parseFloat(avg));
  const myRating = ratings.find(r => r.studentId === currentUser?.id);
  const videos = teacher.videoLinks || [];
  const materials = teacher.materialFiles || [];
  const canRate = showRateButton && currentUser && currentUser.role === 'student' && platformSettings.ratingsEnabled;
  return `<div class="teacher-card">
    <div class="teacher-card-header">
      <div class="teacher-card-avatar">${teacher.photoURL ? `<img src="${teacher.photoURL}" referrerpolicy="no-referrer">` : '👨‍🏫'}</div>
      <div class="teacher-card-info">
        <h4>${escapeHtml(teacher.name)}</h4>
        <p>${getSubjectName(teacher.subject)} • ${teacher.approved ? '✅ معتمد' : '⏳ معلق'}</p>
        <div class="stars-display">
          ${[1,2,3,4,5].map(i => `<span class="${i <= fullStars ? '' : 'star-empty'}">★</span>`).join('')}
          <span style="font-size:13px;color:var(--text-light);font-weight:700;margin-right:6px;">(${avg}) • ${ratings.length} تقييم</span>
        </div>
      </div>
    </div>
    ${teacher.bio ? `<div class="teacher-card-bio" dir="${detectDirection(teacher.bio)}" style="text-align:${detectDirection(teacher.bio) === 'ltr' ? 'left' : 'right'};">${escapeHtml(teacher.bio)}</div>` : ''}
    ${videos.length > 0 || materials.length > 0 ? `<div class="teacher-card-links">
      ${videos.map(v => `<a href="${escapeHtml(v.url)}" target="_blank" rel="noopener" class="teacher-link video">🎥 ${escapeHtml(v.title || 'فيديو')}</a>`).join('')}
      ${materials.map((m, i) => `<button class="teacher-link material" onclick="downloadTeacherMaterial('${teacher.id}', ${i})">📄 ${escapeHtml(m.name)}</button>`).join('')}
    </div>` : ''}
    ${canRate ? `<div class="teacher-rating-row">
      <span style="font-size:13px;color:var(--text-light);">قيّم:${myRating ? ` (تقييمك: ${myRating.stars}★)` : ''}</span>
      <div class="stars-input">
        ${[1,2,3,4,5].map(i => `<span class="star ${myRating && i <= myRating.stars ? 'active' : ''}" onclick="rateTeacher('${teacher.id}', ${i})">★</span>`).join('')}
      </div>
    </div>` : ''}
  </div>`;
}

async function rateTeacher(teacherId, stars) {
  if (!platformSettings.ratingsEnabled) { alert('التقييمات معطّلة'); return; }
  if (!currentUser || currentUser.role !== 'student') { alert('للطلاب فقط'); return; }
  showLoading();
  try {
    const users = await DB.get('users');
    const idx = users.findIndex(u => u.id === teacherId);
    if (idx < 0) return;
    if (!users[idx].ratings) users[idx].ratings = [];
    users[idx].ratings = users[idx].ratings.filter(r => r.studentId !== currentUser.id);
    users[idx].ratings.push({ studentId: currentUser.id, stars, at: Date.now() });
    await DB.set('users', users);
    launchConfetti(10);
    alert(`✅ تم التقييم بـ ${stars} نجوم`);
    if (currentUser.role === 'student') renderStudentDashboard();
  } finally { hideLoading(); }
}

    <div class="form-group"><label class="form-label">عنوان الاختبار</label><input type="text" class="form-input auto-dir" id="quizTitle" dir="rtl"></div>
    <div class="form-group"><label class="form-label">السنة</label><select class="form-select" id="quizGrade"><option value="">اختر</option>${Object.entries(STAGES).map(([s, gs]) => gs.map(g => `<option value="${g}">${g}</option>`).join('')).join('')}</select></div>
    <div class="form-group"><label class="form-label">⏱️ وقت كل سؤال (ث)</label><input type="number" class="form-input" id="quizTime" value="30" min="5" max="600"></div>

function continueToQuestions() {
  const title = document.getElementById('quizTitle').value.trim();
