  if (!title || !grade) { alert('أكمل البيانات'); return; }
  newQuizData.title = title; newQuizData.grade = grade; newQuizData.timePerQuestion = time;
  showQuestionsEditor();
}

function showQuestionsEditor() {
  const qHtml = newQuizData.questions.map((q, i) => {
    const ti = QUESTION_TYPES[q.type] || QUESTION_TYPES.mcq;
    let body = '';
    if (q.type === 'mcq') body = `<div class="question-item-options">${q.options.map((o, oi) => `<div class="question-option-line ${oi === q.answer ? 'correct' : ''}" dir="${detectDirection(o)}" style="text-align:${detectDirection(o) === 'ltr' ? 'left' : 'right'};">${oi === q.answer ? '✓' : ''} ${escapeHtml(o)}</div>`).join('')}</div>`;
    else if (q.type === 'tf') body = `<div class="question-item-options"><div class="question-option-line ${q.answer === true ? 'correct' : ''}">${q.answer === true ? '✓' : ''} صح</div><div class="question-option-line ${q.answer === false ? 'correct' : ''}">${q.answer === false ? '✓' : ''} خطأ</div></div>`;
    else if (q.type === 'fill') body = `<div class="question-option-line correct" dir="${detectDirection(q.answer)}" style="text-align:${detectDirection(q.answer) === 'ltr' ? 'left' : 'right'};">✓ ${escapeHtml(q.answer)}</div>`;
    else body = `<div class="question-option-line">📄 مقالي</div>`;
    return `<div class="question-item">
      <div class="question-item-header">
        <span style="font-weight:900;color:var(--primary);">س${i + 1}</span>
        <span class="question-type-badge qtype-${q.type}">${ti.emoji} ${ti.name}</span>
        <div class="question-item-text" dir="${detectDirection(q.text)}" style="text-align:${detectDirection(q.text) === 'ltr' ? 'left' : 'right'};">${escapeHtml(q.text)}</div>
        <button class="icon-btn icon-btn-danger" onclick="removeQuestion(${i})">🗑</button>
      </div>${body}</div>`;
  }).join('');
  const title = editingQuizId ? 'تعديل: ' + escapeHtml(newQuizData.title) : escapeHtml(newQuizData.title);
  openModal(`<div class="modal-header"><h3 class="modal-title">${title}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    ${editingQuizId ? `<div class="edit-warning">⚠️ وضع التعديل</div>` : ''}
    <p style="margin-bottom:16px;">${newQuizData.questions.length} سؤال • ⏱️ ${newQuizData.timePerQuestion}ث</p>
    ${newQuizData.questions.length > 0 ? qHtml : `<div class="empty-state"><h3>لم تضف أسئلة</h3></div>`}
    <button class="btn btn-outline btn-full" onclick="openAddQuestionForm()" style="margin-top:12px;">➕ إضافة سؤال</button>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-ghost" onclick="${editingQuizId ? 'closeModal()' : 'openNewQuizModal()'}" style="flex:1;">رجوع</button>
      <button class="btn btn-success" onclick="saveQuiz()" style="flex:2;" ${newQuizData.questions.length === 0 ? 'disabled' : ''}>💾 ${editingQuizId ? 'تحديث' : 'حفظ'}</button>
    </div>`);
}

function openAddQuestionForm() { selectedQuestionType = 'mcq'; tfAnswer = true; uploadedImageData = null; renderAddQuestionForm(); }

/* ✅ إصلاح: style مكرر + رفع صورة السؤال مع ضغط */
function renderAddQuestionForm() {
  let fieldsHtml = '';
  if (selectedQuestionType === 'mcq') fieldsHtml = `<div class="form-group"><label class="form-label">الخيارات</label>${[0, 1, 2, 3].map(i => `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;"><input type="radio" name="correctOption" value="${i}" ${i === 0 ? 'checked' : ''} style="width:20px;height:20px;"><input type="text" class="form-input auto-dir" id="opt${i}" placeholder="الخيار ${i + 1}" dir="rtl"></div>`).join('')}</div>`;
  else if (selectedQuestionType === 'tf') fieldsHtml = `<div class="form-group"><label class="form-label">الإجابة</label><div class="tf-options"><button type="button" class="tf-btn true ${tfAnswer === true ? 'selected' : ''}" onclick="pickTFAnswer(true,this)">✓ صح</button><button type="button" class="tf-btn false ${tfAnswer === false ? 'selected' : ''}" onclick="pickTFAnswer(false,this)">✗ خطأ</button></div></div>`;
  else if (selectedQuestionType === 'fill') fieldsHtml = `<div class="form-group"><label class="form-label">الإجابة</label><input type="text" class="form-input auto-dir" id="fillAnswer" dir="rtl"></div>`;
  else fieldsHtml = `<div class="alert alert-info">📄 سؤال مقالي</div>`;
  openModal(`<div class="modal-header"><h3 class="modal-title">سؤال جديد</h3><button class="modal-close" onclick="showQuestionsEditor()">✕</button></div>
    <div class="form-group"><label class="form-label">النوع</label><div class="qtype-picker">${Object.entries(QUESTION_TYPES).map(([k, v]) => `<button type="button" class="qtype-option ${k === selectedQuestionType ? 'active' : ''}" onclick="changeQType('${k}')"><span class="emoji">${v.emoji}</span><span class="label">${v.name}</span></button>`).join('')}</div></div>
    <div class="form-group"><label class="form-label">نص السؤال</label><textarea class="form-textarea auto-dir" id="qText" dir="rtl"></textarea></div>
    <div class="form-group"><label class="form-label">🖼️ صورة</label><input type="file" class="form-input" accept="image/*" id="qImageFile" onchange="handleImageUpload(event)"><div id="imagePreview" style="margin-top:10px;">${uploadedImageData ? `<img src="${uploadedImageData}" style="max-width:100%;max-height:160px;border-radius:10px;"><button class="btn btn-sm btn-danger" onclick="clearImage()" style="margin-top:6px;">🗑</button>` : ''}</div></div>
    ${fieldsHtml}
    <button class="btn btn-primary btn-full" onclick="addQuestion()">إضافة</button>`);
}

function changeQType(t) { selectedQuestionType = t; const txt = document.getElementById('qText')?.value || ''; renderAddQuestionForm(); const ta = document.getElementById('qText'); if (ta) ta.value = txt; }
function pickTFAnswer(v, btn) { tfAnswer = v; document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); }

/* ✅ إصلاح: ضغط صورة السؤال + حد 5MB */
async function handleImageUpload(e) {
  const originalFile = e.target.files[0]; if (!originalFile) return;
  if (!originalFile.type.startsWith('image/')) { alert('اختر صورة فقط'); e.target.value = ''; return; }
  const sizeCheck = validateFileSize(originalFile, MAX_IMAGE_SIZE_MB, 'الصورة');
  if (!sizeCheck.ok) { alert(sizeCheck.msg); e.target.value = ''; return; }
  try {
    let file;
    try { file = await compressImage(originalFile, 1200, 0.8); }
    catch (err) { file = originalFile; }
    if (file.size > 900 * 1024) { alert('الصورة كبيرة بعد الضغط (الحد 900KB)'); e.target.value = ''; return; }
    const r = new FileReader();
    r.onload = (ev) => {
      uploadedImageData = ev.target.result;
      document.getElementById('imagePreview').innerHTML = `<img src="${uploadedImageData}" style="max-width:100%;max-height:160px;border-radius:10px;"><button class="btn btn-sm btn-danger" onclick="clearImage()" style="margin-top:6px;">🗑</button>`;
    };
    r.readAsDataURL(file);
  } catch (err) { alert('فشل معالجة الصورة'); e.target.value = ''; }
}
function clearImage() { uploadedImageData = null; document.getElementById('imagePreview').innerHTML = ''; const fi = document.getElementById('qImageFile'); if (fi) fi.value = ''; }

function addQuestion() {
  const text = document.getElementById('qText').value.trim();
  if (!text) { alert('أدخل السؤال'); return; }
  const q = { type: selectedQuestionType, text, image: uploadedImageData || null };
  if (selectedQuestionType === 'mcq') {
    const opts = [0, 1, 2, 3].map(i => document.getElementById(`opt${i}`).value.trim());
    if (opts.some(o => !o)) { alert('أدخل الخيارات'); return; }
    q.options = opts;
    q.answer = parseInt(document.querySelector('input[name="correctOption"]:checked').value);
  } else if (selectedQuestionType === 'tf') q.answer = tfAnswer;
  else if (selectedQuestionType === 'fill') {
    const a = document.getElementById('fillAnswer').value.trim();
    if (!a) { alert('أدخل الإجابة'); return; }
    q.answer = a;
  } else q.answer = null;
  newQuizData.questions.push(q);
  uploadedImageData = null; tfAnswer = true;
  showQuestionsEditor();
}
function removeQuestion(i) { newQuizData.questions.splice(i, 1); showQuestionsEditor(); }

async function saveQuiz() {
  if (!newQuizData.questions.length) return;
  if (newQuizData.questions.length < platformSettings.minQuizQuestions) { alert(`أدنى عدد أسئلة: ${platformSettings.minQuizQuestions}`); return; }
  if (newQuizData.questions.length > platformSettings.maxQuizQuestions) { alert(`أقصى عدد أسئلة: ${platformSettings.maxQuizQuestions}`); return; }
  showLoading();
  try {
    const quizzes = await DB.get('quizzes');
    if (editingQuizId) {
      const idx = quizzes.findIndex(q => q.id === editingQuizId);
      if (idx >= 0) {
        quizzes[idx] = { ...quizzes[idx], title: newQuizData.title, grade: newQuizData.grade, timePerQuestion: newQuizData.timePerQuestion, questions: newQuizData.questions, updatedAt: Date.now() };
        await DB.set('quizzes', quizzes);
        await logActivity('تعديل اختبار', newQuizData.title);

    renderTeacherDashboard();
  } finally { hideLoading(); }
}

async function editQuiz(quizId) {
  showLoading();
  try {
    const quizzes = await DB.get('quizzes');
    const quiz = quizzes.find(q => q.id === quizId);
    if (!quiz || quiz.teacherId !== currentUser.id) return;

  } finally { hideLoading(); }
}

async function deleteQuiz(quizId) {
  if (!confirm('حذف الاختبار؟')) return;
  showLoading();
  try {
    const quizzes = await DB.get('quizzes');
    const quiz = quizzes.find(q => q.id === quizId);
    await DB.set('quizzes', quizzes.filter(q => q.id !== quizId));
    await DB.set('attempts', (await DB.get('attempts')).filter(a => a.quizId !== quizId));
    await logActivity('حذف اختبار', quiz?.title || quizId);
    closeModal();
    renderTeacherDashboard();
  } finally { hideLoading(); }
}

    const allUsers = await DB.get('users');
    if (pending.length === 0) { openModal(`<div class="modal-header"><h3 class="modal-title">✏️ التصحيح</h3><button class="modal-close" onclick="closeModal()">✕</button></div><div class="empty-state"><div class="empty-state-icon">🎉</div><h3>لا محاولات للتصحيح</h3></div>`); return; }
    openModal(`<div class="modal-header"><h3 class="modal-title">✏️ التصحيح (${pending.length})</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      ${pending.map(a => {
        const quiz = quizzes.find(q => q.id === a.quizId);
        const student = allUsers.find(u => u.id === a.studentId);
        const essayCount = (a.results || []).filter(r => r.correct === null).length;
        return `<div class="history-item" onclick="openGradingAttempt('${a.id}')" style="cursor:pointer;">
          <div class="history-info"><h4>${escapeHtml(student?.name || '')}</h4><p>${escapeHtml(quiz?.title || '')}</p></div>
          <span class="badge badge-warning">${essayCount} مقالي</span>
        </div>`;
      }).join('')}`);
  } finally { hideLoading(); }
}

async function openGradingAttempt(attemptId) {
  showLoading();
  try {
    const allAttempts = await DB.get('attempts');
    const attempt = allAttempts.find(a => a.id === attemptId);
    if (!attempt) return;
    const allQuizzes = await DB.get('quizzes');
    const quiz = allQuizzes.find(q => q.id === attempt.quizId);
    if (!quiz || quiz.teacherId !== currentUser.id) { alert('غير مصرح'); return; }
    const allUsers = await DB.get('users');
    const student = allUsers.find(u => u.id === attempt.studentId);
    const essayQs = quiz.questions.map((q, i) => ({ ...q, index: i })).filter(q => q.type === 'essay');
    const autoScore = attempt.score - (attempt.essayBonusPrev || 0);
    openModal(`<div class="modal-header"><h3 class="modal-title">✏️ تصحيح: ${escapeHtml(student?.name || '')}</h3><button class="modal-close" onclick="openGradingCenter()">✕</button></div>
      <div class="alert alert-info">📝 ${escapeHtml(quiz.title)}<br>📊 الحالية: ${attempt.score}/${attempt.total}<br>🤖 التلقائية: ${autoScore}</div>
      ${essayQs.map(q => {
        const answer = attempt.answers[q.index] || '(لم يجب)';
        const currentGrade = (attempt.essayGrades && attempt.essayGrades[q.index]) ?? 0;
        return `<div class="grading-card">
          <div class="grading-question">س${q.index + 1}: ${escapeHtml(q.text)}</div>
          <div class="grading-answer-label">📝 الإجابة:</div>
          <div class="grading-answer" dir="${detectDirection(answer)}" style="text-align:${detectDirection(answer) === 'ltr' ? 'left' : 'right'};">${escapeHtml(answer)}</div>
          <div class="grading-btn-row">
            ${[0, 0.25, 0.5, 0.75, 1].map(g => `<button class="grade-chip ${currentGrade === g ? 'active' : ''}" onclick="setEssayGrade('${attempt.id}', ${q.index}, ${g}, this)">${g === 0 ? '❌' : g === 1 ? '✅' : g * 100 + '%'}</button>`).join('')}
          </div>
        </div>`;
      }).join('')}
      <button class="btn btn-success btn-full" onclick="finalizeGrading('${attempt.id}')">💾 حفظ</button>`);
  } finally { hideLoading(); }
}

async function setEssayGrade(attemptId, questionIndex, grade, btn) {
  const allAttempts = await DB.get('attempts');
  const attempt = allAttempts.find(a => a.id === attemptId);
  if (!attempt) return;
  if (!attempt.essayGrades) attempt.essayGrades = {};
  attempt.essayGrades[questionIndex] = grade;
  await DB.set('attempts', allAttempts);
  btn.parentElement.querySelectorAll('.grade-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

async function finalizeGrading(attemptId) {
  showLoading();
  try {
    const allAttempts = await DB.get('attempts');
    const attempt = allAttempts.find(a => a.id === attemptId);
    if (!attempt) return;
    const allQuizzes = await DB.get('quizzes');
    const quiz = allQuizzes.find(q => q.id === attempt.quizId);
    if (!quiz || quiz.teacherId !== currentUser.id) { alert('غير مصرح'); return; }
    if (attempt.autoScore === undefined) attempt.autoScore = attempt.score - (attempt.essayBonusPrev || 0);
    const bonus = Object.values(attempt.essayGrades || {}).reduce((a, b) => a + Number(b || 0), 0);
    attempt.score = attempt.autoScore + bonus;
    attempt.essayBonusPrev = bonus;
    attempt.needsGrading = false;
    attempt.graded = true;
    attempt.gradedAt = Date.now();
    await DB.set('attempts', allAttempts);
    const xpGain = Math.round(bonus * 10);
    if (xpGain > 0) await awardXP(attempt.studentId, xpGain, 'مكافأة تصحيح مقالي');
    const notifs = await DB.get('notifications');
    notifs.push({ id: uid(), userId: attempt.studentId, title: '✅ تم التصحيح', body: `"${quiz.title}": ${attempt.score}/${attempt.total}`, createdAt: Date.now(), read: false });
    await DB.set('notifications', notifs);
    launchConfetti(20);
    closeModal();
    renderTeacherDashboard();
  } finally { hideLoading(); }
}

/* ============ EXPORT ============ */
async function exportResults() {
  const quizzes = (await DB.get('quizzes')).filter(q => q.teacherId === currentUser.id);
  const allAttempts = await DB.get('attempts');
  const users = await DB.get('users');
  const attempts = allAttempts.filter(a => quizzes.some(q => q.id === a.quizId));
  if (attempts.length === 0) { alert('لا نتائج'); return; }
  const rows = attempts.map(a => {
    const quiz = quizzes.find(q => q.id === a.quizId);
    const student = users.find(u => u.id === a.studentId);
    return {
      'الطالب': student?.name || '', 'المدرسة': student?.school || '',
      'ولي الأمر': student?.parentName || '', 'هاتف': student?.parentPhone || '',
      'الاختبار': quiz?.title || '', 'المادة': getSubjectName(quiz?.subject),
      'الدرجة': a.score, 'الإجمالي': a.total, 'النسبة %': a.total > 0 ? Math.round((a.score / a.total) * 100) : 0,
      'XP': student?.xp || 0,
      'التاريخ': new Date(a.createdAt).toLocaleDateString('ar-EG')
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'النتائج');
  XLSX.writeFile(wb, 'نتائج_الطلاب.xlsx');
}

async function exportStudents() {
  const users = (await DB.get('users')).filter(u => u.role === 'student');
  if (!users.length) { alert('لا طلاب'); return; }
  const rows = users.map(u => ({
    'الاسم': u.name, 'البريد': u.email, 'المدرسة': u.school || '', 'السنة': u.grade,
    'ولي الأمر': u.parentName || '', 'هاتف': u.parentPhone || '',
    'XP': u.xp || 0, 'الشارات': (u.badges || []).length, 'السلسلة': u.streak || 0,
    'طريقة التسجيل': u.provider === 'google' ? 'Google' : 'بريد',
    'تاريخ التسجيل': new Date(u.createdAt).toLocaleDateString('ar-EG')
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الطلاب');
  XLSX.writeFile(wb, 'الطلاب.xlsx');
}
/* ============ TAKE QUIZ ============ */
async function startQuiz(quizId) {
  showLoading();
  try {
    const quizzes = await DB.get('quizzes');
    const quiz = quizzes.find(q => q.id === quizId);
    if (!quiz) return;
    const allAttempts = await DB.get('attempts');
    if (allAttempts.some(a => a.quizId === quizId && a.studentId === currentUser.id)) { hideLoading(); alert('حللت هذا الاختبار بالفعل.'); return; }
    currentQuiz = quiz; currentQuestionIndex = 0; currentAnswers = [];
    selectedAnswerIndex = null; tfSelected = null;
    showScreen('quiz');
    /* ✅ تحميل الإعلانات في شاشة الاختبار */
    loadActiveAnnouncement();
    renderCurrentQuestion();
  } finally { hideLoading(); }
}

/* ✅ إصلاح: style مكرر في <h3> */
function renderCurrentQuestion() {
  const q = currentQuiz.questions[currentQuestionIndex];
  const ti = QUESTION_TYPES[q.type] || QUESTION_TYPES.mcq;
  const dir = detectDirection(q.text);
  document.getElementById('quizProgressText').textContent = `${currentQuestionIndex + 1} / ${currentQuiz.questions.length}`;
  document.getElementById('quizProgressFill').style.width = `${((currentQuestionIndex + 1) / currentQuiz.questions.length) * 100}%`;
  let answerHtml = '';
  if (q.type === 'mcq') answerHtml = `<div id="quizOptions">${q.options.map((o, i) => {
    const od = detectDirection(o);
    return `<button class="option-btn" onclick="selectMcqAnswer(${i},this)" dir="${od}" style="text-align:${od === 'ltr' ? 'left' : 'right'}"><span class="option-letter">${String.fromCharCode(1571 + i)}</span><span>${escapeHtml(o)}</span></button>`;
  }).join('')}</div>`;
  else if (q.type === 'tf') answerHtml = `<div class="tf-options" id="quizOptions"><button class="tf-btn true" onclick="selectTfAnswer(true,this)">✓ صح</button><button class="tf-btn false" onclick="selectTfAnswer(false,this)">✗ خطأ</button></div>`;
  else if (q.type === 'fill') answerHtml = `<input type="text" class="form-input auto-dir" id="fillInput" placeholder="إجابتك..." oninput="onFillInput()" style="font-size:16px;padding:16px;" dir="rtl">`;
  else if (q.type === 'essay') answerHtml = `<textarea class="form-textarea auto-dir" id="essayInput" placeholder="إجابتك المفصلة..." style="min-height:150px;" oninput="onEssayInput()" dir="rtl"></textarea>`;
  document.getElementById('quizContent').innerHTML = `
    <div class="question-type-badge qtype-${q.type}">${ti.emoji} ${ti.name}</div>
    ${q.image ? `<img src="${q.image}" class="question-image">` : ''}
    <div style="background:var(--primary-light);padding:20px;border-radius:14px;margin-bottom:20px;border-right:4px solid var(--primary);">
      <h3 dir="${dir}" style="font-size:18px;font-weight:800;text-align:${dir === 'ltr' ? 'left' : 'right'};">${escapeHtml(q.text)}</h3>
    </div>
    ${answerHtml}
    <div style="margin-top:20px;">
      <button class="btn btn-primary btn-full" id="quizNextBtn" onclick="nextQuizQuestion()" disabled>${currentQuestionIndex === currentQuiz.questions.length - 1 ? 'إنهاء' : 'التالي'}</button>
    </div>`;
  startTimer();
  bindAutoDirToInputs();
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = currentQuiz.timePerQuestion || 30;
  updateTimerUI();
  timerInterval = setInterval(() => {
    timeLeft--; updateTimerUI();
    if (timeLeft <= 0) { clearInterval(timerInterval); handleTimeout(); }
  }, 1000);
}
function updateTimerUI() {
  const d = document.getElementById('timerDisplay'), b = document.getElementById('timerBox');
  if (!d || !b) return;
  d.textContent = timeLeft;
  b.classList.remove('warning', 'danger');
  if (timeLeft <= 5) b.classList.add('danger');
  else if (timeLeft <= 10) b.classList.add('warning');
}
function handleTimeout() {
  if (selectedAnswerIndex === null) {
    const q = currentQuiz.questions[currentQuestionIndex];
    if (q.type === 'fill') { const i = document.getElementById('fillInput'); currentAnswers.push(i ? i.value.trim() : ''); }
    else if (q.type === 'essay') { const i = document.getElementById('essayInput'); currentAnswers.push(i ? i.value.trim() : ''); }
    else currentAnswers.push(null);
  } else currentAnswers.push(selectedAnswerIndex);
  selectedAnswerIndex = null; tfSelected = null;
  currentQuestionIndex++;
  if (currentQuestionIndex >= currentQuiz.questions.length) finishQuiz();
  else renderCurrentQuestion();
}
function selectMcqAnswer(i, btn) { selectedAnswerIndex = i; document.querySelectorAll('#quizOptions .option-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); document.getElementById('quizNextBtn').disabled = false; }
function selectTfAnswer(v, btn) { tfSelected = v; selectedAnswerIndex = v; document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); document.getElementById('quizNextBtn').disabled = false; }
function onFillInput() { document.getElementById('quizNextBtn').disabled = !document.getElementById('fillInput').value.trim(); }
function onEssayInput() { document.getElementById('quizNextBtn').disabled = !document.getElementById('essayInput').value.trim(); }
function nextQuizQuestion() {
  const q = currentQuiz.questions[currentQuestionIndex];
  let a;
  if (q.type === 'mcq') a = selectedAnswerIndex;
  else if (q.type === 'tf') a = tfSelected;
  else if (q.type === 'fill') a = document.getElementById('fillInput').value.trim();
  else if (q.type === 'essay') a = document.getElementById('essayInput').value.trim();
  currentAnswers.push(a);
  selectedAnswerIndex = null; tfSelected = null;
  currentQuestionIndex++;
  clearInterval(timerInterval);
  if (currentQuestionIndex >= currentQuiz.questions.length) finishQuiz();
  else renderCurrentQuestion();
}
function checkAnswer(q, a) {
  if (q.type === 'mcq') return a === q.answer;
  if (q.type === 'tf') return a === q.answer;
  if (q.type === 'fill') { if (!a || !q.answer) return false; return a.trim().toLowerCase() === q.answer.trim().toLowerCase(); }
  if (q.type === 'essay') return null;
  return false;
}

/* ✅ إصلاح: معالجة الاختبار المقالي بالكامل */
async function finishQuiz() {
  clearInterval(timerInterval);
  showLoading();
  try {
    const existing = await DB.get('attempts');
    if (existing.some(a => a.quizId === currentQuiz.id && a.studentId === currentUser.id)) { hideLoading(); alert('حللت هذا الاختبار بالفعل.'); exitQuiz(); return; }
    let score = 0, autoGraded = 0, hasEssay = false;
    const results = currentQuiz.questions.map((q, i) => {
      const a = currentAnswers[i];
      const c = checkAnswer(q, a);
      if (c === true) { score++; autoGraded++; }
      else if (c === false) autoGraded++;
      else if (c === null) hasEssay = true;
      return { questionIndex: i, answer: a, correct: c };
    });
    const attempt = { id: uid(), quizId: currentQuiz.id, studentId: currentUser.id, score, total: currentQuiz.questions.length, autoGraded, autoScore: score, answers: currentAnswers, results, createdAt: Date.now(), needsGrading: hasEssay, graded: !hasEssay, essayGrades: {}, essayBonusPrev: 0 };
    existing.push(attempt);
    await DB.set('attempts', existing);
    const xpGain = calculateXPForAttempt(attempt);
    await awardXP(currentUser.id, xpGain, `حل اختبار: ${currentQuiz.title}`);
    await updateStreak(currentUser.id);
    const newBadges = await checkAndAwardBadges(currentUser.id);
    const freshUsers = await DB.get('users');
    const freshMe = freshUsers.find(u => u.id === currentUser.id);
    if (freshMe) currentUser = freshMe;
    const pct = autoGraded > 0 ? Math.round((score / autoGraded) * 100) : null;
    const essayCount = currentQuiz.questions.filter(q => q.type === 'essay').length;
    let emoji, title, color;
    if (pct === null) { emoji = '⏳'; title = 'بانتظار التصحيح'; color = 'var(--warning)'; }
    else if (pct >= 80) { emoji = '🏆'; title = 'ممتاز! 🎉'; color = 'var(--success)'; launchConfetti(100); }
    else if (pct >= 50) { emoji = '👍'; title = 'جيد جداً'; color = 'var(--primary)'; }
    else { emoji = '💪'; title = 'حاول مرة أخرى'; color = 'var(--danger)'; }
    document.getElementById('quizContent').innerHTML = `
      <div style="text-align:center;padding:20px 0;">
        <div style="font-size:80px;margin-bottom:16px;">${emoji}</div>
        <h2 style="font-size:26px;font-weight:900;margin-bottom:12px;color:${color};">${title}</h2>
        <div style="font-size:56px;font-weight:900;color:var(--primary);">${score}<span style="font-size:28px;color:var(--text-light);"> / ${autoGraded}</span></div>
        <p style="font-size:20px;font-weight:700;color:var(--text-light);">${pct !== null ? pct + '% (التلقائي)' : 'سيتم تصحيح الأسئلة المقالية قريباً'}</p>
        <div class="alert alert-success" style="margin-top:16px;">🎉 <strong>+${xpGain} XP</strong> • إجمالي: ${currentUser.xp || 0} XP</div>
        ${newBadges.length > 0 ? `<div class="alert alert-warning" style="text-align:right;">🏆 <strong>شارات جديدة:</strong> ${newBadges.map(b => `${BADGES[b].emoji} ${BADGES[b].name}`).join(' • ')}</div>` : ''}
        ${essayCount > 0 ? `<div class="alert alert-warning" style="text-align:right;">📄 لديك ${essayCount} سؤال مقالي</div>` : ''}
        <div class="alert alert-info" style="text-align:right;">🔒 لا يمكن إعادة الحل.</div>
        <button class="btn btn-primary btn-lg" onclick="exitQuiz()" style="margin-top:20px;">🏠 العودة</button>
      </div>`;
    document.getElementById('quizProgressFill').style.width = '100%';
    document.getElementById('quizProgressText').textContent = 'تم';
  } finally { hideLoading(); }
}
function exitQuiz() {
  clearInterval(timerInterval);
  currentQuiz = null; currentAnswers = []; currentQuestionIndex = 0;
  selectedAnswerIndex = null; tfSelected = null;
  enterDashboard();
}
