/* ============================================================
   ============ Student: Take Quiz ============
   ============================================================ */
async function startQuiz(quizId) {
  showLoading();
  try {
    const quizzes = await DB.get('quizzes');
    const quiz = quizzes.find(q => q.id === quizId);
    if (!quiz) return;

    const allAttempts = await DB.get('attempts');
    const alreadySolved = allAttempts.some(a => a.quizId === quizId && a.studentId === currentUser.id);
    if (alreadySolved) {
      hideLoading();
      alert('لقد قمت بحل هذا الاختبار بالفعل. لا يمكن إعادة حله.');
      return;
    }

    currentQuiz = quiz; currentQuestionIndex = 0; currentAnswers = [];
    selectedAnswerIndex = null; tfSelected = null;
    showScreen('quiz'); renderCurrentQuestion();
  } finally {
    hideLoading();
  }
}
function renderCurrentQuestion() {
  const q = currentQuiz.questions[currentQuestionIndex];
  const ti = QUESTION_TYPES[q.type] || QUESTION_TYPES.mcq;
  document.getElementById('quizProgressText').textContent = `${currentQuestionIndex + 1} / ${currentQuiz.questions.length}`;
  document.getElementById('quizProgressFill').style.width = `${((currentQuestionIndex + 1) / currentQuiz.questions.length) * 100}%`;
  let answerHtml = '';
  if (q.type === 'mcq') answerHtml = `<div id="quizOptions">${q.options.map((o, i) => `<button class="option-btn" onclick="selectMcqAnswer(${i},this)"><span class="option-letter">${String.fromCharCode(1571 + i)}</span><span>${escapeHtml(o)}</span></button>`).join('')}</div>`;
  else if (q.type === 'tf') answerHtml = `<div class="tf-options" id="quizOptions"><button class="tf-btn true" onclick="selectTfAnswer(true,this)">✓ صح</button><button class="tf-btn false" onclick="selectTfAnswer(false,this)">✗ خطأ</button></div>`;
  else if (q.type === 'fill') answerHtml = `<div class="form-group"><input type="text" class="form-input" id="fillInput" placeholder="اكتب إجابتك..." oninput="onFillInput()" style="font-size:16px;padding:16px;"></div>`;
  else if (q.type === 'essay') answerHtml = `<div class="form-group"><textarea class="form-textarea" id="essayInput" placeholder="اكتب إجابتك المفصلة..." style="min-height:150px;" oninput="onEssayInput()"></textarea></div>`;
  document.getElementById('quizContent').innerHTML = `
    <div class="question-type-badge qtype-${q.type}" style="margin-bottom:8px;">${ti.emoji} ${ti.name}</div>
    ${q.image ? `<img src="${q.image}" class="question-image">` : ''}
    <div style="background:var(--primary-light);padding:20px;border-radius:14px;margin-bottom:20px;border-right:4px solid var(--primary);">
      <h3 style="font-size:18px;font-weight:800;line-height:1.6;">${escapeHtml(q.text)}</h3>
    </div>
    ${answerHtml}
    <div style="display:flex;gap:8px;margin-top:20px;">
      <button class="btn btn-primary btn-full" id="quizNextBtn" onclick="nextQuizQuestion()" disabled>${currentQuestionIndex === currentQuiz.questions.length - 1 ? 'إنهاء' : 'التالي'}</button>
    </div>`;
  startTimer();
}
function startTimer() {
  clearInterval(timerInterval);
  timeLeft = currentQuiz.timePerQuestion || 30;
  updateTimerUI();
  timerInterval = setInterval(() => {
    timeLeft--; updateTimerUI();
    if (timeLeft <= 0) { clearInterval(timerInterval); handleTimeout(); }
  }, 1000);
}
function updateTimerUI() {
  const d = document.getElementById('timerDisplay'), b = document.getElementById('timerBox');
  if (!d || !b) return;
  d.textContent = timeLeft;
  b.classList.remove('warning', 'danger');
  if (timeLeft <= 5) b.classList.add('danger');
  else if (timeLeft <= 10) b.classList.add('warning');
}
function handleTimeout() {
  if (selectedAnswerIndex === null) {
    const q = currentQuiz.questions[currentQuestionIndex];
    if (q.type === 'fill') { const i = document.getElementById('fillInput'); currentAnswers.push(i ? i.value.trim() : ''); }
    else if (q.type === 'essay') { const i = document.getElementById('essayInput'); currentAnswers.push(i ? i.value.trim() : ''); }
    else currentAnswers.push(null);
  } else currentAnswers.push(selectedAnswerIndex);
  selectedAnswerIndex = null; tfSelected = null;
  currentQuestionIndex++;
  if (currentQuestionIndex >= currentQuiz.questions.length) finishQuiz();
  else renderCurrentQuestion();
}
function selectMcqAnswer(i, btn) { selectedAnswerIndex = i; document.querySelectorAll('#quizOptions .option-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); document.getElementById('quizNextBtn').disabled = false; }
function selectTfAnswer(v, btn) { tfSelected = v; selectedAnswerIndex = v; document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); document.getElementById('quizNextBtn').disabled = false; }
function onFillInput() { document.getElementById('quizNextBtn').disabled = !document.getElementById('fillInput').value.trim(); }
function onEssayInput() { document.getElementById('quizNextBtn').disabled = !document.getElementById('essayInput').value.trim(); }
function nextQuizQuestion() {
  const q = currentQuiz.questions[currentQuestionIndex];
  let a;
  if (q.type === 'mcq') a = selectedAnswerIndex;
  else if (q.type === 'tf') a = tfSelected;
  else if (q.type === 'fill') a = document.getElementById('fillInput').value.trim();
  else if (q.type === 'essay') a = document.getElementById('essayInput').value.trim();
  currentAnswers.push(a);
  selectedAnswerIndex = null; tfSelected = null;
  currentQuestionIndex++;
  clearInterval(timerInterval);
  if (currentQuestionIndex >= currentQuiz.questions.length) finishQuiz();
  else renderCurrentQuestion();
}
function checkAnswer(q, a) {
  if (q.type === 'mcq') return a === q.answer;
  if (q.type === 'tf') return a === q.answer;
  if (q.type === 'fill') { if (!a || !q.answer) return false; return a.trim().toLowerCase() === q.answer.trim().toLowerCase(); }
  if (q.type === 'essay') return null;
  return false;
}
async function finishQuiz() {
  clearInterval(timerInterval);
  showLoading();
  try {
    const existing = await DB.get('attempts');
    if (existing.some(a => a.quizId === currentQuiz.id && a.studentId === currentUser.id)) {
      hideLoading();
      alert('لقد قمت بحل هذا الاختبار بالفعل.');
      exitQuiz();
      return;
    }

    let score = 0, autoGraded = 0, hasEssay = false;
    const results = currentQuiz.questions.map((q, i) => {
      const a = currentAnswers[i];
      const c = checkAnswer(q, a);
      if (c === true) { score++; autoGraded++; }
      else if (c === false) autoGraded++;
      else if (c === null) hasEssay = true;
      return { questionIndex: i, answer: a, correct: c };
    });
    const attempt = {
      id: uid(), quizId: currentQuiz.id, studentId: currentUser.id,
      score, total: currentQuiz.questions.length, autoGraded,
      autoScore: score,
      answers: currentAnswers, results, createdAt: Date.now(),
      needsGrading: hasEssay, graded: !hasEssay,
      essayGrades: {}, essayBonusPrev: 0
    };
    existing.push(attempt);
    await DB.set('attempts', existing);

    const pct = autoGraded > 0 ? Math.round((score / autoGraded) * 100) : 0;
    const emoji = pct >= 80 ? '🏆' : pct >= 50 ? '👍' : '💪';
    const title = pct >= 80 ? 'ممتاز! 🎉' : pct >= 50 ? 'جيد جداً' : 'حاول مرة أخرى';
    const msg = pct >= 80 ? 'أداء رائع!' : pct >= 50 ? 'يمكنك الأفضل' : 'راجع وحاول مجدداً!';
    const essayCount = currentQuiz.questions.filter(q => q.type === 'essay').length;

    document.getElementById('quizContent').innerHTML = `
      <div style="text-align:center;padding:20px 0;">
        <div style="font-size:80px;margin-bottom:16px;">${emoji}</div>
        <h2 style="font-size:26px;font-weight:900;margin-bottom:12px;color:${pct>=80?'var(--success)':pct>=50?'var(--primary)':'var(--danger)'};">${title}</h2>
        <div style="font-size:56px;font-weight:900;color:var(--primary);margin-bottom:4px;">${score}<span style="font-size:28px;color:var(--text-light);"> / ${autoGraded}</span></div>
        <p style="font-size:20px;font-weight:700;color:var(--text-light);margin-bottom:12px;">${pct}% (التلقائي)</p>
        ${essayCount > 0 ? `<div class="alert alert-warning" style="text-align:right;">📄 لديك <strong>${essayCount}</strong> سؤال مقالي — سيتم تصحيحه من قبل المعلم. سيصلك إشعار عند اكتمال التصحيح.</div>` : ''}
        <div class="alert alert-info" style="text-align:right;">🔒 لا يمكن إعادة حل هذا الاختبار. تم تسجيل محاولتك الوحيدة.</div>
        <p style="font-size:15px;color:var(--text-light);margin-bottom:28px;line-height:1.7;">${msg}</p>
        <button class="btn btn-primary btn-lg" onclick="exitQuiz()">🏠 العودة</button>
      </div>`;
    document.getElementById('quizProgressFill').style.width = '100%';
    document.getElementById('quizProgressText').textContent = 'تم';
  } finally {
    hideLoading();
  }
}
function exitQuiz() {
  clearInterval(timerInterval);
  currentQuiz = null; currentAnswers = []; currentQuestionIndex = 0;
  selectedAnswerIndex = null; tfSelected = null;
  enterDashboard();
}

/* ============================================================
   ============ بدء التطبيق ============
   ============================================================ */
window.addEventListener('DOMContentLoaded', async () => {
  loadDarkMode();
  document.getElementById('devYear').textContent = new Date().getFullYear();
  await initFirebase();
  const ok = await checkSession();
  if (!ok) showScreen('auth');
});
document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') closeModal(); });

/* ============================================================
   ============ Global Exports ============
   ============================================================ */
const globalFns = [
  switchAuthTab, pickRole, handleRegister, handleLogin, handleGoogleSignIn, handleForgotPassword, logout, toggleDarkMode,
  openFirebaseConfig, applyFirebaseConfig, clearFirebaseConfig, openNotifications, closeModal,
  openNewQuizModal, continueToQuestions, showQuestionsEditor, openAddQuestionForm, changeQType,
  pickTFAnswer, handleImageUpload, clearImage, addQuestion, removeQuestion, saveQuiz,
  openQuizManage, deleteQuiz, startQuiz, selectMcqAnswer, selectTfAnswer, onFillInput, onEssayInput,
  nextQuizQuestion, exitQuiz, exportResults, exportStudents, openGradingCenter, openGradingAttempt,
  setEssayGrade, finalizeGrading, pickGoogleRole, completeGoogleProfile, cancelGoogleProfile
];
globalFns.forEach(fn => { try { window[fn.name] = fn; } catch(e) {} });
</script>
</body>
</html>
