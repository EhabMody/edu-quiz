<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة تعليمية | EduPlatform Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root {
    --primary: #4f46e5; --primary-dark: #4338ca; --primary-light: #eef2ff;
    --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --info: #3b82f6;
    --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --text-light: #64748b;
    --border: #e2e8f0;
    --shadow: 0 10px 30px rgba(79, 70, 229, 0.12);
    --shadow-lg: 0 20px 60px rgba(79, 70, 229, 0.2);
  }
  body.dark-mode {
    --primary: #818cf8; --primary-dark: #6366f1; --primary-light: #312e81;
    --success: #34d399; --danger: #f87171; --warning: #fbbf24; --info: #60a5fa;
    --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --text-light: #94a3b8;
    --border: #334155;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden; transition: background 0.3s, color 0.3s;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(circle at 15% 15%, rgba(79,70,229,0.10), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(139,92,246,0.10), transparent 45%);
    z-index: -1;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .auth-wrapper { max-width: 480px; margin: 60px auto; padding: 20px; }
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  .card { background: var(--card); border-radius: 20px; padding: 28px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .auth-header { text-align: center; margin-bottom: 28px; }
  .auth-logo { font-size: 64px; margin-bottom: 12px; }
  .auth-title { font-size: 28px; font-weight: 900; margin-bottom: 6px; color: var(--text); }
  .auth-subtitle { font-size: 15px; color: var(--text-light); }
  .tabs { display: flex; background: var(--bg); padding: 6px; border-radius: 14px; margin-bottom: 24px; }
  .tab { flex: 1; padding: 12px; border: none; background: transparent; border-radius: 10px; font-family: inherit; font-size: 15px; font-weight: 700; color: var(--text-light); cursor: pointer; transition: all 0.2s; }
  .tab.active { background: var(--card); color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
  .form-input, .form-select, .form-textarea {
    width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: 12px;
    font-family: inherit; font-size: 15px; color: var(--text); background: var(--card);
    transition: all 0.2s; outline: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); }
  .form-textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
  .role-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .role-option { padding: 20px 12px; border: 2px solid var(--border); border-radius: 14px; background: var(--card); cursor: pointer; font-family: inherit; text-align: center; transition: all 0.2s; }
  .role-option:hover { border-color: var(--primary); }
  .role-option.active { border-color: var(--primary); background: var(--primary-light); }
  .role-emoji { font-size: 32px; margin-bottom: 6px; }
  .role-label { font-size: 15px; font-weight: 700; color: var(--text); }
  .role-option.active .role-label { color: var(--primary); }
  .btn { padding: 14px 24px; border-radius: 12px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-full { width: 100%; } .btn-lg { padding: 16px 28px; font-size: 16px; } .btn-sm { padding: 10px 16px; font-size: 13px; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79,70,229,0.3); }
  .btn-success { background: var(--success); color: #fff; } .btn-success:hover { background: #059669; transform: translateY(-2px); }
  .btn-danger { background: var(--danger); color: #fff; } .btn-danger:hover { background: #dc2626; transform: translateY(-2px); }
  .btn-outline { background: transparent; color: var(--text); border: 2px solid var(--border); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
  .btn-ghost { background: transparent; color: var(--text-light); } .btn-ghost:hover { background: var(--bg); color: var(--text); }
  .alert { padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; margin-bottom: 16px; }
  .alert-error { background: #fee2e2; color: #991b1b; } .alert-success { background: #d1fae5; color: #065f46; }
  .dashboard-header { background: linear-gradient(135deg, var(--primary), #7c3aed); color: #fff; padding: 24px 0; margin-bottom: 24px; }
  .header-content { max-width: 1100px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
  .header-user { display: flex; align-items: center; gap: 14px; }
  .user-avatar { width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 26px; border: 2px solid rgba(255,255,255,0.3); }
  .user-info h3 { font-size: 18px; font-weight: 800; margin-bottom: 2px; } .user-info p { font-size: 13px; opacity: 0.9; }
  .header-actions { display: flex; gap: 8px; }
  .header-actions .btn { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.25); }
  .header-actions .btn:hover { background: rgba(255,255,255,0.25); transform: translateY(-1px); }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--card); padding: 20px; border-radius: 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; }
  .stat-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
  .stat-icon.primary { background: var(--primary-light); color: var(--primary); }
  .stat-icon.success { background: #d1fae5; } .stat-icon.warning { background: #fef3c7; } .stat-icon.info { background: #dbeafe; }
  .stat-info h4 { font-size: 26px; font-weight: 900; color: var(--text); line-height: 1.2; }
  .stat-info p { font-size: 13px; color: var(--text-light); font-weight: 600; }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
  .section-title { font-size: 22px; font-weight: 900; }
  .section-subtitle { font-size: 14px; color: var(--text-light); margin-top: 4px; font-weight: 600; }
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .subject-card { background: var(--card); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); cursor: pointer; transition: all 0.2s; border: 2px solid transparent; }
  .subject-card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: var(--shadow-lg); }
  .subject-emoji { font-size: 36px; margin-bottom: 10px; } .subject-name { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .subject-meta { font-size: 13px; color: var(--text-light); font-weight: 600; margin-bottom: 12px; }
  .subject-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--border); flex-wrap: wrap; gap: 6px; }
  .badge { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; }
  .badge-primary { background: var(--primary-light); color: var(--primary); } .badge-success { background: #d1fae5; color: #065f46; }
  .badge-warning { background: #fef3c7; color: #92400e; } .badge-info { background: #dbeafe; color: #1e40af; } .badge-danger { background: #fee2e2; color: #991b1b; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
  .empty-state h3 { font-size: 20px; font-weight: 800; margin-bottom: 8px; color: var(--text); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 1000; overflow-y: auto; }
  .modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }
  .modal { background: var(--card); border-radius: 20px; padding: 28px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
  @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-title { font-size: 22px; font-weight: 900; }
  .modal-close { width: 36px; height: 36px; border-radius: 10px; border: none; background: var(--bg); font-size: 18px; cursor: pointer; color: var(--text-light); transition: all 0.2s; }
  .modal-close:hover { background: var(--danger); color: #fff; }
  .quiz-progress-bar { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; margin-bottom: 20px; }
  .quiz-progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #8b5cf6); transition: width 0.5s ease; }
  .option-btn { width: 100%; background: var(--card); border: 2px solid var(--border); padding: 16px 20px; border-radius: 12px; font-family: inherit; font-size: 15px; font-weight: 600; text-align: right; cursor: pointer; transition: all 0.2s; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; color: var(--text); }
  .option-btn:hover { border-color: var(--primary); background: var(--primary-light); }
  .option-btn.selected { background: var(--primary); border-color: var(--primary); color: #fff; }
  .option-letter { width: 32px; height: 32px; border-radius: 8px; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; }
  .option-btn.selected .option-letter { background: rgba(255,255,255,0.25); color: #fff; }
  .question-item { background: var(--bg); border-radius: 14px; padding: 16px; margin-bottom: 12px; border-right: 4px solid var(--primary); }
  .question-item-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .question-item-text { font-weight: 700; font-size: 15px; flex: 1; line-height: 1.6; min-width: 150px; }
  .question-item-options { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .question-option-line { padding: 8px 12px; background: var(--card); border-radius: 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .question-option-line.correct { background: #d1fae5; color: #065f46; font-weight: 700; }
  .icon-btn { width: 32px; height: 32px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-size: 15px; }
  .icon-btn-danger { background: #fee2e2; color: var(--danger); } .icon-btn-danger:hover { background: var(--danger); color: #fff; }
  .icon-btn-primary { background: var(--primary-light); color: var(--primary); } .icon-btn-primary:hover { background: var(--primary); color: #fff; }
  .history-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: var(--bg); border-radius: 12px; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
  .history-info { flex: 1; min-width: 150px; } .history-info h4 { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
  .history-info p { font-size: 13px; color: var(--text-light); font-weight: 600; } .history-score { font-size: 22px; font-weight: 900; color: var(--primary); }
  .timer-box { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--primary-light); color: var(--primary); border-radius: 12px; font-weight: 800; font-size: 15px; transition: all 0.3s; }
  .timer-box.warning { background: #fef3c7; color: #92400e; animation: pulse 1s infinite; }
  .timer-box.danger { background: #fee2e2; color: #991b1b; animation: pulse 0.5s infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .question-type-badge { display: inline-block; padding: 3px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; margin-bottom: 8px; }
  .qtype-mcq { background: var(--primary-light); color: var(--primary); } .qtype-tf { background: #d1fae5; color: #065f46; }
  .qtype-fill { background: #fef3c7; color: #92400e; } .qtype-essay { background: #dbeafe; color: #1e40af; }
  .question-image { max-width: 100%; max-height: 280px; border-radius: 12px; margin-bottom: 16px; object-fit: contain; display: block; }
  .tf-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tf-btn { padding: 20px; border: 2px solid var(--border); background: var(--card); border-radius: 14px; font-family: inherit; font-size: 20px; font-weight: 800; cursor: pointer; transition: all 0.2s; color: var(--text); }
  .tf-btn:hover { border-color: var(--primary); }
  .tf-btn.selected.true { background: var(--success); border-color: var(--success); color: #fff; }
  .tf-btn.selected.false { background: var(--danger); border-color: var(--danger); color: #fff; }
  .qtype-picker { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  .qtype-option { padding: 14px 10px; border: 2px solid var(--border); border-radius: 12px; background: var(--card); cursor: pointer; font-family: inherit; text-align: center; transition: all 0.2s; }
  .qtype-option:hover { border-color: var(--primary); } .qtype-option.active { border-color: var(--primary); background: var(--primary-light); }
  .qtype-option .emoji { font-size: 22px; display: block; margin-bottom: 4px; }
  .qtype-option .label { font-size: 12px; font-weight: 700; color: var(--text); } .qtype-option.active .label { color: var(--primary); }
  .firebase-banner { background: #fef3c7; border: 1px solid #fcd34d; color: #92400e; padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .dark-mode .firebase-banner { background: #78350f; border-color: #b45309; color: #fef3c7; }
  .chart-container { position: relative; height: 300px; margin-bottom: 24px; }
  .notification-badge { position: absolute; top: -4px; left: -4px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 800; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .student-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: var(--bg); border-radius: 12px; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
  .student-info { flex: 1; min-width: 150px; } .student-info h4 { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
  .student-info p { font-size: 13px; color: var(--text-light); font-weight: 600; }
  @media (max-width: 600px) {
    .card { padding: 20px; } .auth-wrapper { margin: 20px auto; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); } .stat-card { flex-direction: column; text-align: center; }
    .section-title { font-size: 18px; } .modal { padding: 20px; } .user-info h3 { font-size: 16px; }
    .qtype-picker { grid-template-columns: 1fr 1fr; } .chart-container { height: 220px; }
  }
</style>
</head>
<body>

<!-- ============= شاشة تسجيل الدخول ============= -->
<section id="authScreen" class="screen active">
  <div class="auth-wrapper">
    <div class="card">
      <div class="auth-header">
        <div class="auth-logo">🎓</div>
        <h1 class="auth-title">منصة تعليمية</h1>
        <p class="auth-subtitle">سجل دخولك للبدء</p>
      </div>
      <div class="tabs">
        <button class="tab active" onclick="switchAuthTab('login')">تسجيل دخول</button>
        <button class="tab" onclick="switchAuthTab('register')">حساب جديد</button>
      </div>
      <div id="authAlert"></div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group"><label class="form-label">البريد الإلكتروني</label><input type="email" class="form-input" id="loginEmail" required placeholder="you@example.com"></div>
        <div class="form-group"><label class="form-label">كلمة المرور</label><input type="password" class="form-input" id="loginPassword" required placeholder="••••••••"></div>
        <button type="submit" class="btn btn-primary btn-full btn-lg">دخول</button>
      </form>
      <form id="registerForm" style="display:none;" onsubmit="handleRegister(event)">
        <div class="form-group"><label class="form-label">الاسم الكامل</label><input type="text" class="form-input" id="regName" required placeholder="أدخل اسمك الكامل"></div>
        <div class="form-group"><label class="form-label">البريد الإلكتروني</label><input type="email" class="form-input" id="regEmail" required placeholder="you@example.com"></div>
        <div class="form-group"><label class="form-label">كلمة المرور</label><input type="password" class="form-input" id="regPassword" required minlength="6" placeholder="6 أحرف على الأقل"></div>
        <div class="form-group">
          <label class="form-label">أنا...</label>
          <div class="role-picker">
            <button type="button" class="role-option" data-role="teacher" onclick="pickRole('teacher')"><div class="role-emoji">👨‍🏫</div><div class="role-label">مدرس</div></button>
            <button type="button" class="role-option" data-role="student" onclick="pickRole('student')"><div class="role-emoji">👨‍🎓</div><div class="role-label">طالب</div></button>
          </div>
        </div>
        <div id="studentFields" style="display:none;">
          <div class="form-group"><label class="form-label">المرحلة الدراسية</label><select class="form-select" id="regStage"><option value="">اختر المرحلة</option><option value="ابتدائي">ابتدائي</option><option value="إعدادي">إعدادي</option><option value="ثانوي">ثانوي</option></select></div>
          <div class="form-group"><label class="form-label">السنة الدراسية</label><select class="form-select" id="regGrade"><option value="">اختر السنة</option></select></div>
        </div>
        <div id="teacherFields" style="display:none;">
          <div class="form-group"><label class="form-label">المادة التي تدرّسها</label><select class="form-select" id="regSubject"><option value="">اختر المادة</option></select></div>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg">إنشاء الحساب</button>
      </form>
    </div>
  </div>
</section>

<!-- ============= لوحة التحكم ============= -->
<section id="dashboardScreen" class="screen">
  <div class="dashboard-header">
    <div class="header-content">
      <div class="header-user">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div class="user-info"><h3 id="userName">المستخدم</h3><p id="userMeta">-</p></div>
      </div>
      <div class="header-actions">
        <button class="btn btn-sm" onclick="toggleDarkMode()" id="darkModeBtn">🌙</button>
        <button class="btn btn-sm" onclick="openNotifications()" style="position:relative;" id="notifBtn">🔔<span class="notification-badge" id="notifBadge" style="display:none;">0</span></button>
        <button class="btn btn-sm" onclick="openFirebaseConfig()" title="إعداد Firebase">⚙️</button>
        <button class="btn btn-sm" onclick="logout()">🚪 خروج</button>
      </div>
    </div>
  </div>
  <div id="firebaseStatus"></div>
  <div class="container" id="dashboardContent"></div>
</section>

<!-- ============= شاشة الاختبار ============= -->
<section id="quizScreen" class="screen">
  <div class="container" style="max-width:700px; padding-top: 30px;">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px;">
        <button class="btn btn-ghost btn-sm" onclick="exitQuiz()">✕ إلغاء</button>
        <div class="timer-box" id="timerBox"><span>⏱️</span><span id="timerDisplay">30</span><span>ث</span></div>
        <span id="quizProgressText" style="font-weight:800; color:var(--primary);">1 / 5</span>
      </div>
      <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="quizProgressFill"></div></div>
      <div id="quizContent"></div>
    </div>
  </div>
</section>

<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>

<script>
/* ============================================================
   ============ Web Crypto API - تشفير كلمات المرور ============
   ============================================================ */
// استخدام PBKDF2 مع SHA-256 و 100,000 دورة - نفس المعيار الذي تستخدمه مكتبات مثل @qcksys/web-crypto-auth [citation:3][citation:9]
async function hashPassword(password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const keyMaterial = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), { name: 'PBKDF2' }, false, ['deriveBits']
  );
  const derivedBits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
    keyMaterial, 256
  );
  const hashArray = new Uint8Array(derivedBits);
  const saltB64 = btoa(String.fromCharCode(...salt));
  const hashB64 = btoa(String.fromCharCode(...hashArray));
  return `pbkdf2_sha256$100000$${saltB64}$${hashB64}`;
}

async function verifyPassword(storedHash, password) {
  try {
    const parts = storedHash.split('$');
    if (parts.length !== 4 || parts[0] !== 'pbkdf2_sha256') return false;
    const iterations = parseInt(parts[1]);
    const salt = Uint8Array.from(atob(parts[2]), c => c.charCodeAt(0));
    const expectedHash = parts[3];
    const keyMaterial = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(password), { name: 'PBKDF2' }, false, ['deriveBits']
    );
    const derivedBits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: salt, iterations: iterations, hash: 'SHA-256' },
      keyMaterial, 256
    );
    const hashArray = new Uint8Array(derivedBits);
    const computedHash = btoa(String.fromCharCode(...hashArray));
    // مقارنة بسيطة (في الإنتاج يُفضل استخدام مقارنة ثابتة الزمن)
    return computedHash === expectedHash;
  } catch { return false; }
}

let firebaseDB = null, firebaseEnabled = false;
function loadFirebaseConfig() { try { const c = localStorage.getItem('edu_firebase_config'); return c ? JSON.parse(c) : null; } catch { return null; } }
function saveFirebaseConfig(c) { localStorage.setItem('edu_firebase_config', JSON.stringify(c)); }
async function initFirebase() {
  const config = loadFirebaseConfig();
  if (!config || !config.apiKey || !config.databaseURL) { firebaseEnabled = false; updateFirebaseStatus(); return; }
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const { getDatabase, ref, set, onValue, get } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");
    const app = initializeApp(config);
    firebaseDB = { db: getDatabase(app), ref, set, onValue, get };
    firebaseEnabled = true; updateFirebaseStatus(); console.log('✅ Firebase متصل');
  } catch (err) { console.error('❌ Firebase:', err); firebaseEnabled = false; updateFirebaseStatus('فشل الاتصال: ' + err.message); }
}
function updateFirebaseStatus(error) {
  const el = document.getElementById('firebaseStatus'); if (!el) return;
  if (error) { el.innerHTML = `<div class="container"><div class="alert alert-error">${escapeHtml(error)}</div></div>`; return; }
  el.innerHTML = firebaseEnabled ? `<div class="container"><div class="alert alert-success">✅ Firebase متصل - مزامنة سحابية مفعلة</div></div>` : '';
}

/* ============================================================
   ============ إدارة البيانات ============
   ============================================================ */
const DB = {
  async get(key, defaultValue = []) {
    let localData = defaultValue;
    try { const d = localStorage.getItem('edu_' + key); localData = d ? JSON.parse(d) : defaultValue; } catch {}
    if (firebaseEnabled && firebaseDB) {
      try {
        const snapshot = await firebaseDB.get(firebaseDB.ref(firebaseDB.db, key));
        const remoteData = snapshot.val();
        if (remoteData) { if (Array.isArray(remoteData)) return remoteData; if (typeof remoteData === 'object') return Object.values(remoteData); }
      } catch (e) { console.warn('FB get:', e); }
    }
    return localData;
  },
  async set(key, value) {
    localStorage.setItem('edu_' + key, JSON.stringify(value));
    if (firebaseEnabled && firebaseDB) { try { await firebaseDB.set(firebaseDB.ref(firebaseDB.db, key), value); } catch (e) { console.warn('FB set:', e); } }
  }
};

function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 9); }
function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function getSubjectEmoji(id) { const s = SUBJECTS.find(x=>x.id===id); return s?s.emoji:'📚'; }
function getSubjectName(id) { const s = SUBJECTS.find(x=>x.id===id); return s?s.name:id; }
function showAlert(msg, type='error') { const b = document.getElementById('authAlert'); b.innerHTML = `<div class="alert alert-${type==='error'?'error':'success'}">${escapeHtml(msg)}</div>`; setTimeout(()=>{b.innerHTML='';},4000); }
function showScreen(name) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(name+'Screen').classList.add('active'); window.scrollTo(0,0); }
function calculateAvg(attempts) { if(!attempts.length) return 0; return Math.round(attempts.reduce((a,x)=>a+(x.score/x.total)*100,0)/attempts.length); }

async function handleRegister(e) {
  e.preventDefault();
  const name=document.getElementById('regName').value.trim(), email=document.getElementById('regEmail').value.trim().toLowerCase(), password=document.getElementById('regPassword').value;
  if(!selectedRole){showAlert('اختر دورك');return;}
  const users=await DB.get('users');
  if(users.find(u=>u.email===email)){showAlert('البريد مسجل');return;}
  const user={id:uid(),name,email,role:selectedRole,createdAt:Date.now()};
  // تشفير كلمة المرور قبل التخزين
  user.passwordHash = await hashPassword(password);
  if(selectedRole==='student'){ const stage=document.getElementById('regStage').value, grade=document.getElementById('regGrade').value; if(!stage||!grade){showAlert('اختر المرحلة والسنة');return;} user.stage=stage; user.grade=grade; }
  else { const subject=document.getElementById('regSubject').value; if(!subject){showAlert('اختر المادة');return;} user.subject=subject; }
  users.push(user); await DB.set('users', users);
  // إشعار للمدرس الجديد (اختياري)
  currentUser=user; localStorage.setItem('edu_session',user.id); showAlert('تم إنشاء الحساب!','success'); setTimeout(()=>enterDashboard(),500);
}

async function handleLogin(e) {
  e.preventDefault();
  const email=document.getElementById('loginEmail').value.trim().toLowerCase(), password=document.getElementById('loginPassword').value;
  const users=await DB.get('users');
  const user=users.find(u=>u.email===email);
  if(!user){showAlert('البريد أو كلمة المرور غير صحيحة');return;}
  // التحقق من كلمة المرور المشفرة
  let valid=false;
  if(user.passwordHash){ valid=await verifyPassword(user.passwordHash, password); }
  else if(user.password){ valid=(user.password===password); } // توافق مع الحسابات القديمة
  if(!valid){showAlert('البريد أو كلمة المرور غير صحيحة');return;}
  currentUser=user; localStorage.setItem('edu_session',user.id); enterDashboard();
}

function openAddQuestionForm() { selectedQuestionType='mcq'; tfAnswer=true; uploadedImageData=null; renderAddQuestionForm(); }
function renderAddQuestionForm() {
  let fieldsHtml='';
  if(selectedQuestionType==='mcq'){ fieldsHtml=`<div class="form-group"><label class="form-label">الخيارات</label>${[0,1,2,3].map(i=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;"><input type="radio" name="correctOption" value="${i}" ${i===0?'checked':''} style="width:20px;height:20px;"><input type="text" class="form-input" id="opt${i}" placeholder="الخيار ${i+1}"></div>`).join('')}</div>`; }
  else if(selectedQuestionType==='tf'){ fieldsHtml=`<div class="form-group"><label class="form-label">الإجابة</label><div class="tf-options"><button type="button" class="tf-btn true ${tfAnswer===true?'selected':''}" onclick="pickTFAnswer(true,this)">✓ صح</button><button type="button" class="tf-btn false ${tfAnswer===false?'selected':''}" onclick="pickTFAnswer(false,this)">✗ خطأ</button></div></div>`; }
  else if(selectedQuestionType==='fill'){ fieldsHtml=`<div class="form-group"><label class="form-label">الإجابة</label><input type="text" class="form-input" id="fillAnswer" placeholder="النص المتوقع"></div>`; }
  else if(selectedQuestionType==='essay'){ fieldsHtml=`<div class="alert alert-success">📄 سؤال مقالي - تصحيح يدوي</div>`; }
  openModal(`<div class="modal-header"><h3 class="modal-title">سؤال جديد</h3><button class="modal-close" onclick="showQuestionsEditor()">✕</button></div>
    <div class="form-group"><label class="form-label">النوع</label><div class="qtype-picker">${Object.entries(QUESTION_TYPES).map(([k,v])=>`<button type="button" class="qtype-option ${k===selectedQuestionType?'active':''}" onclick="changeQType('${k}')"><span class="emoji">${v.emoji}</span><span class="label">${v.name}</span></button>`).join('')}</div></div>
    <div class="form-group"><label class="form-label">نص السؤال</label><textarea class="form-textarea" id="qText" placeholder="اكتب السؤال..."></textarea></div>
    <div class="form-group"><label class="form-label">🖼️ صورة (اختياري)</label><input type="file" class="form-input" accept="image/*" id="qImageFile" onchange="handleImageUpload(event)"><div id="imagePreview" style="margin-top:10px;">${uploadedImageData?`<img src="${uploadedImageData}" style="max-width:100%;max-height:160px;border-radius:10px;"><button type="button" class="btn btn-sm btn-danger" onclick="clearImage()" style="margin-top:6px;">🗑 إزالة</button>`:''}</div></div>
    ${fieldsHtml}
    <button class="btn btn-primary btn-full" onclick="addQuestion()">إضافة</button>`);
}
function changeQType(t){ selectedQuestionType=t; const txt=document.getElementById('qText')?.value||''; renderAddQuestionForm(); const ta=document.getElementById('qText'); if(ta)ta.value=txt; }
function pickTFAnswer(v,btn){ tfAnswer=v; document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); }
function handleImageUpload(e){ const f=e.target.files[0]; if(!f)return; if(f.size>800*1024){alert('الصورة كبيرة (الحد 800KB)');e.target.value='';return;} const r=new FileReader(); r.onload=(ev)=>{uploadedImageData=ev.target.result; document.getElementById('imagePreview').innerHTML=`<img src="${uploadedImageData}" style="max-width:100%;max-height:160px;border-radius:10px;"><button type="button" class="btn btn-sm btn-danger" onclick="clearImage()" style="margin-top:6px;">🗑 إزالة</button>`;}; r.readAsDataURL(f); }
function clearImage(){ uploadedImageData=null; document.getElementById('imagePreview').innerHTML=''; const fi=document.getElementById('qImageFile'); if(fi)fi.value=''; }
function addQuestion(){
  const text=document.getElementById('qText').value.trim(); if(!text){alert('أدخل السؤال');return;}
  const q={type:selectedQuestionType,text,image:uploadedImageData||null};
  if(selectedQuestionType==='mcq'){ const opts=[0,1,2,3].map(i=>document.getElementById(`opt${i}`).value.trim()); if(opts.some(o=>!o)){alert('أدخل جميع الخيارات');return;} q.options=opts; q.answer=parseInt(document.querySelector('input[name="correctOption"]:checked').value); }
  else if(selectedQuestionType==='tf'){ q.answer=tfAnswer; }
  else if(selectedQuestionType==='fill'){ const a=document.getElementById('fillAnswer').value.trim(); if(!a){alert('أدخل الإجابة');return;} q.answer=a; }
  else if(selectedQuestionType==='essay'){ q.answer=null; }
  newQuizData.questions.push(q); uploadedImageData=null; tfAnswer=true; showQuestionsEditor();
}
function removeQuestion(i){ newQuizData.questions.splice(i,1); showQuestionsEditor(); }
async function saveQuiz(){
  if(!newQuizData.questions.length)return;
  const quiz={id:uid(),teacherId:currentUser.id,title:newQuizData.title,subject:newQuizData.subject,grade:newQuizData.grade,timePerQuestion:newQuizData.timePerQuestion,questions:newQuizData.questions,createdAt:Date.now()};

/* ============================================================
   ============ Student: Take Quiz ============
   ============================================================ */
async function startQuiz(quizId) {
  const quizzes=await DB.get('quizzes'), quiz=quizzes.find(q=>q.id===quizId); if(!quiz)return;
  currentQuiz=quiz; currentQuestionIndex=0; currentAnswers=[]; selectedAnswerIndex=null; tfSelected=null;
  showScreen('quiz'); renderCurrentQuestion();
}
function renderCurrentQuestion() {
  const q=currentQuiz.questions[currentQuestionIndex], ti=QUESTION_TYPES[q.type]||QUESTION_TYPES.mcq;
  document.getElementById('quizProgressText').textContent=`${currentQuestionIndex+1} / ${currentQuiz.questions.length}`;
  document.getElementById('quizProgressFill').style.width=`${((currentQuestionIndex+1)/currentQuiz.questions.length)*100}%`;
  let answerHtml='';
  if(q.type==='mcq'){ answerHtml=`<div id="quizOptions">${q.options.map((o,i)=>`<button class="option-btn" onclick="selectMcqAnswer(${i},this)"><span class="option-letter">${String.fromCharCode(1571+i)}</span><span>${escapeHtml(o)}</span></button>`).join('')}</div>`; }
  else if(q.type==='tf'){ answerHtml=`<div class="tf-options" id="quizOptions"><button class="tf-btn true" onclick="selectTfAnswer(true,this)">✓ صح</button><button class="tf-btn false" onclick="selectTfAnswer(false,this)">✗ خطأ</button></div>`; }
  else if(q.type==='fill'){ answerHtml=`<div class="form-group"><input type="text" class="form-input" id="fillInput" placeholder="اكتب إجابتك..." oninput="onFillInput()" style="font-size:16px;padding:16px;"></div>`; }
  else if(q.type==='essay'){ answerHtml=`<div class="form-group"><textarea class="form-textarea" id="essayInput" placeholder="اكتب إجابتك المفصلة..." style="min-height:150px;" oninput="onEssayInput()"></textarea></div>`; }
  document.getElementById('quizContent').innerHTML=`<div class="question-type-badge qtype-${q.type}" style="margin-bottom:8px;">${ti.emoji} ${ti.name}</div>${q.image?`<img src="${q.image}" class="question-image">`:''}<div style="background:var(--primary-light);padding:20px;border-radius:14px;margin-bottom:20px;border-right:4px solid var(--primary);"><h3 style="font-size:18px;font-weight:800;line-height:1.6;">${escapeHtml(q.text)}</h3></div>${answerHtml}<div style="display:flex;gap:8px;margin-top:20px;"><button class="btn btn-primary btn-full" id="quizNextBtn" onclick="nextQuizQuestion()" disabled>${currentQuestionIndex===currentQuiz.questions.length-1?'إنهاء':'التالي'}</button></div>`;
  startTimer();
}
function startTimer() { clearInterval(timerInterval); timeLeft=currentQuiz.timePerQuestion||30; updateTimerUI(); timerInterval=setInterval(()=>{ timeLeft--; updateTimerUI(); if(timeLeft<=0){ clearInterval(timerInterval); handleTimeout(); } },1000); }
function updateTimerUI() { const d=document.getElementById('timerDisplay'), b=document.getElementById('timerBox'); if(!d||!b)return; d.textContent=timeLeft; b.classList.remove('warning','danger'); if(timeLeft<=5)b.classList.add('danger'); else if(timeLeft<=10)b.classList.add('warning'); }
function handleTimeout() { if(selectedAnswerIndex===null){ const q=currentQuiz.questions[currentQuestionIndex]; if(q.type==='fill'){ const i=document.getElementById('fillInput'); currentAnswers.push(i?i.value.trim():''); } else if(q.type==='essay'){ const i=document.getElementById('essayInput'); currentAnswers.push(i?i.value.trim():''); } else { currentAnswers.push(null); } } else { currentAnswers.push(selectedAnswerIndex); } selectedAnswerIndex=null; tfSelected=null; currentQuestionIndex++; if(currentQuestionIndex>=currentQuiz.questions.length) finishQuiz(); else renderCurrentQuestion(); }
function selectMcqAnswer(i,btn){ selectedAnswerIndex=i; document.querySelectorAll('#quizOptions .option-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); document.getElementById('quizNextBtn').disabled=false; }
function selectTfAnswer(v,btn){ tfSelected=v; selectedAnswerIndex=v; document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); document.getElementById('quizNextBtn').disabled=false; }
function onFillInput(){ document.getElementById('quizNextBtn').disabled=!document.getElementById('fillInput').value.trim(); }
function onEssayInput(){ document.getElementById('quizNextBtn').disabled=!document.getElementById('essayInput').value.trim(); }
function nextQuizQuestion() {
  const q=currentQuiz.questions[currentQuestionIndex]; let a;
  if(q.type==='mcq')a=selectedAnswerIndex; else if(q.type==='tf')a=tfSelected; else if(q.type==='fill')a=document.getElementById('fillInput').value.trim(); else if(q.type==='essay')a=document.getElementById('essayInput').value.trim();
  currentAnswers.push(a); selectedAnswerIndex=null; tfSelected=null; currentQuestionIndex++; clearInterval(timerInterval);
  if(currentQuestionIndex>=currentQuiz.questions.length)finishQuiz(); else renderCurrentQuestion();
}
function checkAnswer(q,a) { if(q.type==='mcq')return a===q.answer; if(q.type==='tf')return a===q.answer; if(q.type==='fill'){ if(!a||!q.answer)return false; return a.trim().toLowerCase()===q.answer.trim().toLowerCase(); } if(q.type==='essay')return null; return false; }
async function finishQuiz() {
  clearInterval(timerInterval); let score=0, autoGraded=0;
  const results=currentQuiz.questions.map((q,i)=>{ const a=currentAnswers[i], c=checkAnswer(q,a); if(c===true){score++;autoGraded++;} else if(c===false)autoGraded++; return {questionIndex:i,answer:a,correct:c}; });
  const attempt={id:uid(),quizId:currentQuiz.id,studentId:currentUser.id,score,total:currentQuiz.questions.length,autoGraded,answers:currentAnswers,results,createdAt:Date.now()};
  const attempts=await DB.get('attempts'); attempts.push(attempt); await DB.set('attempts',attempts);
  const pct=autoGraded>0?Math.round((score/autoGraded)*100):0;
  const emoji=pct>=80?'🏆':pct>=50?'👍':'💪', title=pct>=80?'ممتاز! 🎉':pct>=50?'جيد جداً':'حاول مرة أخرى';
  const msg=pct>=80?'أداء رائع!':pct>=50?'يمكنك الأفضل':'راجع وحاول مجدداً!';
  const essayCount=currentQuiz.questions.filter(q=>q.type==='essay').length;
  document.getElementById('quizContent').innerHTML=`<div style="text-align:center;padding:20px 0;"><div style="font-size:80px;margin-bottom:16px;">${emoji}</div><h2 style="font-size:26px;font-weight:900;margin-bottom:12px;color:${pct>=80?'var(--success)':pct>=50?'var(--primary)':'var(--danger)'};">${title}</h2><div style="font-size:56px;font-weight:900;color:var(--primary);margin-bottom:4px;">${score}<span style="font-size:28px;color:var(--text-light);"> / ${autoGraded}</span></div><p style="font-size:20px;font-weight:700;color:var(--text-light);margin-bottom:12px;">${pct}%</p>${essayCount>0?`<p style="font-size:13px;color:var(--warning);margin-top:8px;">📄 ${essayCount} سؤال مقالي بحاجة لتصحيح يدوي</p>`:''}<p style="font-size:15px;color:var(--text-light);margin-bottom:28px;line-height:1.7;">${msg}</p><button class="btn btn-primary btn-lg" onclick="exitQuiz()">🏠 العودة</button></div>`;
  document.getElementById('quizProgressFill').style.width='100%'; document.getElementById('quizProgressText').textContent='تم';
}
function exitQuiz() { clearInterval(timerInterval); currentQuiz=null; currentAnswers=[]; currentQuestionIndex=0; selectedAnswerIndex=null; tfSelected=null; enterDashboard(); }

/* ============================================================
   ============ Start App ============
   ============================================================ */
window.addEventListener('DOMContentLoaded', async () => { loadDarkMode(); await initFirebase(); const ok=await checkSession(); if(!ok)showScreen('auth'); });
document.getElementById('modalOverlay').addEventListener('click', (e) => { if(e.target.id==='modalOverlay')closeModal(); });
</script>
</body>
